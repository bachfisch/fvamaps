<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wasserrückhalt im Wald – Karte</title>

  <link rel="stylesheet" href="../vendor/maplibre-gl.css" />
  <link rel="stylesheet" href="../base/basemap.css?v=20260917" />
</head>
<body>
  <div id="map"></div>

  <script src="../vendor/maplibre-gl.js"></script>
  <script src="../base/basemap.js?v=20260917"></script>
  <script>
    /**
     * WRW – Wasserrückhalt im Wald
     * -----------------------------------------------------------------
     * 44 Landkreis-Flächen (eingefärbt nach Hauptzielsetzung) und 27
     * Maßnahmenstandorte mit Klick-Popup (Hauptzielsetzung, Maßnahmen, Bild).
     * Geodaten:
     *   data/wrw_landkreise.geojson
     *   data/wrw_standorte.geojson
     * Kartenausschnitt (ganz BW) kommt aus der Basemap; die Legende steht in
     * LEGEND_ITEMS.
     * -----------------------------------------------------------------
     */

    const LANDKREISE_URL = "./data/wrw_landkreise.geojson";
    const STANDORTE_URL = "./data/wrw_standorte.geojson";

    // Legende im Standardformat (Farbe + Beschriftung). Farben entsprechen
    // den fillColor-Werten der Landkreis-Flächen (siehe wrw_landkreise.geojson).
    const LEGEND_TITLE = "Hauptzielsetzung";
    const LEGEND_ITEMS = [
      { color: "#FFAEB9", label: "Bestandesvitalität" },
      { color: "#87CEEB", label: "Erosionsschutz" },
      { color: "#90EE90", label: "Grundwasserneubildung" },
      { color: "#FFE7BA", label: "Hochwasserschutz" },
      { color: "#FFA07A", label: "Ökologie/Feuchthabitate" },
      { color: "#BEBEBE", label: "Kein Pilotprojekt" },
    ];

    initMap();

    function initMap() {
      const map = FVAMap.create({
        container: "map",
        // Kartenausschnitt kommt aus der Basemap (Standard: ganz BW).
        ariaLabel: "Wasserrückhalt im Wald – Landkreise und Maßnahmenstandorte",
      });

      // Braucht map (hängt die Lightbox in den Karten-Container statt in
      // document.body, damit sie auch im nativen Fullscreen sichtbar bleibt
      // - siehe Kommentar über initImageLightbox in basemap.js).
      FVAMap.initImageLightbox(map);

      const tooltip = FVAMap.createHoverTooltip(map);

      map.on("load", () => {
        map.addSource("landkreise", { type: "geojson", data: LANDKREISE_URL, generateId: true });
        map.addSource("standorte", { type: "geojson", data: STANDORTE_URL, generateId: true });

        map.addLayer({
          id: "landkreise-fill",
          type: "fill",
          source: "landkreise",
          paint: {
            "fill-color": ["get", "fillColor"],
            "fill-opacity": [
              "case", ["boolean", ["feature-state", "hover"], false],
              0.8, ["get", "fillOpacity"],
            ],
          },
        });

        map.addLayer({
          id: "landkreise-line",
          type: "line",
          source: "landkreise",
          paint: {
            "line-color": ["get", "color"],
            "line-width": [
              "case", ["boolean", ["feature-state", "hover"], false],
              ["+", ["get", "weight"], 2], ["get", "weight"],
            ],
            "line-opacity": ["get", "opacity"],
          },
        });

        map.addLayer({
          id: "standorte-punkte",
          type: "circle",
          source: "standorte",
          paint: {
            "circle-radius": [
              "case", ["boolean", ["feature-state", "hover"], false],
              ["+", ["get", "radius"], 4], ["get", "radius"],
            ],
            "circle-color": ["get", "fillColor"],
            "circle-opacity": ["get", "fillOpacity"],
            "circle-stroke-color": ["get", "color"],
            "circle-stroke-width": [
              "case", ["boolean", ["feature-state", "hover"], false],
              ["+", ["get", "weight"], 1.5], ["get", "weight"],
            ],
            "circle-stroke-opacity": ["get", "opacity"],
          },
        });

        // Hover-Hervorhebung (feature-state) + Cursor für beide Layer.
        FVAMap.enableHoverState(map, "landkreise-fill", "landkreise");
        FVAMap.enableHoverState(map, "standorte-punkte", "standorte");

        // -- Landkreise: Hover-Tooltip ------------------------------------
        map.on("mousemove", "landkreise-fill", (e) => {
          const p = e.features[0].properties;
          tooltip.show(
            `<div class="fva-tooltip__title">${p.label}</div>` +
            `<div>Hauptzielsetzung: <b>${p.hauptzielsetzung}</b></div>` +
            `<div>Projektgemeinde: <b>${p.projektgemeinde}</b></div>`,
            e.point,
            { html: true }
          );
        });
        map.on("mouseleave", "landkreise-fill", () => tooltip.hide());

        // -- Standorte: Hover-Tooltip (Name) -----------------------------
        map.on("mousemove", "standorte-punkte", (e) => {
          tooltip.show(
            `<div class="fva-tooltip__title">${e.features[0].properties.label}</div>`,
            e.point,
            { html: true }
          );
        });
        map.on("mouseleave", "standorte-punkte", () => tooltip.hide());

        // -- Klick-Popup nur für Standorte ---------------------------------
        map.on("click", "standorte-punkte", (e) => {
          openStandortPopup(map, e.features[0].properties);
        });

        // -- Legende (Standardformat, immer unten rechts) ----------------
        FVAMap.addLegend(map, {
          title: LEGEND_TITLE,
          items: LEGEND_ITEMS,
        });
      });
    }

    /** Öffnet das Popup für einen Maßnahmenstandort (Hülle + Inhalt). */
    function openStandortPopup(map, props) {
      const root = document.createElement("div");
      root.className = "fva-popup fva-popup--large";

      const header = document.createElement("div");
      header.className = "fva-popup__header";
      header.textContent = props.popup_name;
      root.appendChild(header);

      const body = document.createElement("div");
      body.className = "fva-popup__body";
      root.appendChild(body);

      let massnahmenListe = props.popup_massnahmen;
      if (typeof massnahmenListe === "string") {
        try { massnahmenListe = JSON.parse(massnahmenListe); }
        catch (err) { massnahmenListe = []; }
      }
      if (!Array.isArray(massnahmenListe)) massnahmenListe = [];

      const rowHz = document.createElement("div");
      rowHz.className = "fva-popup__row";
      rowHz.style.flexDirection = "column";
      rowHz.style.alignItems = "flex-start";
      rowHz.innerHTML =
        `<span class="fva-popup__row-label">Hauptzielsetzung</span>` +
        `<span>${props.popup_hz}</span>`;
      body.appendChild(rowHz);

      if (massnahmenListe.length) {
        const wrap = document.createElement("div");
        wrap.style.marginTop = "8px";
        const label = document.createElement("div");
        label.className = "fva-popup__row-label";
        label.textContent = "Umgesetzte Maßnahmen";
        wrap.appendChild(label);

        const ul = document.createElement("ul");
        ul.style.margin = "4px 0 0 0";
        ul.style.paddingLeft = "18px";
        massnahmenListe.forEach((m) => {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = m[0];
          a.target = "_blank";
          a.rel = "noopener";
          a.textContent = m[1];
          li.appendChild(a);
          ul.appendChild(li);
        });
        wrap.appendChild(ul);
        body.appendChild(wrap);
      }

      if (props.popup_img) {
        const popupImg = document.createElement("img");
        popupImg.className = "fva-popup__img";
        popupImg.src = props.popup_img;
        popupImg.setAttribute("data-full", props.popup_img);
        popupImg.alt = props.popup_name || "";
        body.appendChild(popupImg);
      }

      // Zentriertes Modal statt maplibregl.Popup + setLngLat() - das Bild
      // kann groß sein, und ein an den Standort verankertes Popup würde je
      // nach Klickposition/Kartenausschnitt irgendwo am Rand aufklappen statt
      // sich wie beim EPS-Modal verlässlich mittig zu zeigen. Kein manuelles
      // Repositionieren nach dem Bildladen mehr nötig - das Modal hat keinen
      // Anker, der sich verschieben könnte.
      FVAMap.openModal(map, root);
    }
  </script>
</body>
</html>
