<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wasserrückhalt im Wald – Karte</title>

  <link rel="stylesheet" href="../vendor/maplibre-gl.css" />
  <link rel="stylesheet" href="../base/basemap.css" />
</head>
<body>
  <div id="map"></div>
  <div id="hoverTooltip" class="fva-tooltip"></div>

  <script src="../vendor/maplibre-gl.js"></script>
  <script src="../base/basemap.js"></script>
  <script>
    /**
     * WRW – Wasserrückhalt im Wald
     * -----------------------------------------------------------------
     * Umgestellt auf die gemeinsame Basemap. Echte Geodaten (44
     * Landkreis-Flächen, 27 Maßnahmenstandorte), extrahiert aus der
     * ursprünglichen Karte in:
     *   data/wrw_landkreise.geojson
     *   data/wrw_standorte.geojson
     *   data/wrw_meta.json  (bounds, Legenden-Titel/-Inhalt)
     *
     * Gegenüber dem Original geändert:
     *  - Karten-Init läuft über BehoerdeMap.create() (gemeinsame Basemap,
     *    Controls, Style).
     *  - Legende läuft über BehoerdeMap.createLegendControl() (gleiche
     *    Bausteine wie bei allen anderen Karten, weiterhin einklappbar).
     *  - Popup nutzt die gemeinsame Popup-Hülle (fva-popup__…) statt der
     *    seiteneigenen .popup-card-Klassen.
     *  - Bild-Lightbox läuft über die gemeinsame BehoerdeMap.initImageLightbox()
     *    statt einer eigenen Implementierung.
     * Unverändert: alle fachlichen Daten, Hover-Verhalten (feature-state),
     * Klick-Popup-Inhalte (Hauptzielsetzung, Maßnahmen, Bild).
     * -----------------------------------------------------------------
     */

    const LANDKREISE_URL = "./data/wrw_landkreise.geojson";
    const STANDORTE_URL = "./data/wrw_standorte.geojson";
    const META_URL = "./data/wrw_meta.json";

    BehoerdeMap.initImageLightbox();

    fetch(META_URL)
      .then((res) => res.json())
      .then((meta) => initMap(meta))
      .catch((err) => {
        console.error("[WRW] Konnte Metadaten nicht laden:", err);
        initMap({ bounds: null, legend_title: "Legende", legend_items_html: "" });
      });

    function initMap(meta) {
      const map = BehoerdeMap.create({
        container: "map",
        bounds: meta.bounds || undefined,
        fitBoundsOptions: { padding: 20 },
      });

      const tooltip = document.getElementById("hoverTooltip");
      const hoveredId = { landkreise: null, standorte: null };

      function setHover(source, id, state) {
        map.setFeatureState({ source, id }, { hover: state });
      }

      map.on("load", () => {
        map.addSource("landkreise", { type: "geojson", data: LANDKREISE_URL, generateId: true });
        map.addSource("standorte", { type: "geojson", data: STANDORTE_URL, generateId: true });

        map.addLayer({
          id: "landkreise-fill",
          type: "fill",
          source: "landkreise",
          paint: {
            "fill-color": ["get", "fillColor"],
            "fill-opacity": [
              "case", ["boolean", ["feature-state", "hover"], false],
              0.8, ["get", "fillOpacity"],
            ],
          },
        });

        map.addLayer({
          id: "landkreise-line",
          type: "line",
          source: "landkreise",
          paint: {
            "line-color": ["get", "color"],
            "line-width": [
              "case", ["boolean", ["feature-state", "hover"], false],
              ["+", ["get", "weight"], 2], ["get", "weight"],
            ],
            "line-opacity": ["get", "opacity"],
          },
        });

        map.addLayer({
          id: "standorte-punkte",
          type: "circle",
          source: "standorte",
          paint: {
            "circle-radius": [
              "case", ["boolean", ["feature-state", "hover"], false],
              ["+", ["get", "radius"], 4], ["get", "radius"],
            ],
            "circle-color": ["get", "fillColor"],
            "circle-opacity": ["get", "fillOpacity"],
            "circle-stroke-color": ["get", "color"],
            "circle-stroke-width": [
              "case", ["boolean", ["feature-state", "hover"], false],
              ["+", ["get", "weight"], 1.5], ["get", "weight"],
            ],
            "circle-stroke-opacity": ["get", "opacity"],
          },
        });

        // -- Landkreise: Hover-Hervorhebung + Tooltip ----------------------
        map.on("mousemove", "landkreise-fill", (e) => {
          map.getCanvas().style.cursor = "pointer";
          const f = e.features[0];

          if (hoveredId.landkreise !== null && hoveredId.landkreise !== f.id) {
            setHover("landkreise", hoveredId.landkreise, false);
          }
          hoveredId.landkreise = f.id;
          setHover("landkreise", f.id, true);

          tooltip.style.display = "block";
          tooltip.style.left = e.point.x + "px";
          tooltip.style.top = e.point.y + "px";
          tooltip.innerHTML =
            `<div class="tt-title" style="font-weight:700;margin-bottom:2px;">${f.properties.label}</div>` +
            `<div>Hauptzielsetzung: <b>${f.properties.hauptzielsetzung}</b></div>` +
            `<div>Projektgemeinde: <b>${f.properties.projektgemeinde}</b></div>`;
        });

        map.on("mouseleave", "landkreise-fill", () => {
          map.getCanvas().style.cursor = "";
          tooltip.style.display = "none";
          if (hoveredId.landkreise !== null) {
            setHover("landkreise", hoveredId.landkreise, false);
            hoveredId.landkreise = null;
          }
        });

        // -- Standorte: Hover-Tooltip (Name) --------------------------------
        map.on("mousemove", "standorte-punkte", (e) => {
          map.getCanvas().style.cursor = "pointer";
          const f = e.features[0];

          if (hoveredId.standorte !== null && hoveredId.standorte !== f.id) {
            setHover("standorte", hoveredId.standorte, false);
          }
          hoveredId.standorte = f.id;
          setHover("standorte", f.id, true);

          tooltip.style.display = "block";
          tooltip.style.left = e.point.x + "px";
          tooltip.style.top = e.point.y + "px";
          tooltip.innerHTML = `<div style="font-weight:700;">${f.properties.label}</div>`;
        });

        map.on("mouseleave", "standorte-punkte", () => {
          map.getCanvas().style.cursor = "";
          tooltip.style.display = "none";
          if (hoveredId.standorte !== null) {
            setHover("standorte", hoveredId.standorte, false);
            hoveredId.standorte = null;
          }
        });

        // -- Klick-Popup nur für Standorte ---------------------------------
        map.on("click", "standorte-punkte", (e) => {
          const f = e.features[0];
          BehoerdeMap.openPopup(map, e.lngLat, {
            title: f.properties.popup_name,
            large: true,
            render: (body) => renderStandortPopup(body, f.properties),
          });
        });

        // -- Legende --------------------------------------------------------
        map.addControl(
          BehoerdeMap.createLegendControl({
            title: meta.legend_title || "Legende",
            html: meta.legend_items_html || "",
          }),
          "top-right"
        );
      });
    }

    /** Popup-Inhalt für einen Maßnahmenstandort (fachlich unverändert). */
    function renderStandortPopup(body, props) {
      let massnahmenListe = props.popup_massnahmen;
      if (typeof massnahmenListe === "string") {
        try { massnahmenListe = JSON.parse(massnahmenListe); }
        catch (err) { massnahmenListe = []; }
      }
      if (!Array.isArray(massnahmenListe)) massnahmenListe = [];

      body.innerHTML = "";

      const rowHz = document.createElement("div");
      rowHz.className = "fva-popup__row";
      rowHz.style.flexDirection = "column";
      rowHz.style.alignItems = "flex-start";
      rowHz.innerHTML =
        `<span class="fva-popup__row-label">Hauptzielsetzung</span>` +
        `<span>${props.popup_hz}</span>`;
      body.appendChild(rowHz);

      if (massnahmenListe.length) {
        const wrap = document.createElement("div");
        wrap.style.marginTop = "8px";
        const label = document.createElement("div");
        label.className = "fva-popup__row-label";
        label.textContent = "Umgesetzte Maßnahmen";
        wrap.appendChild(label);

        const ul = document.createElement("ul");
        ul.style.margin = "4px 0 0 0";
        ul.style.paddingLeft = "18px";
        massnahmenListe.forEach((m) => {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = m[0];
          a.target = "_blank";
          a.rel = "noopener";
          a.textContent = m[1];
          li.appendChild(a);
          ul.appendChild(li);
        });
        wrap.appendChild(ul);
        body.appendChild(wrap);
      }

      if (props.popup_img) {
        const img = document.createElement("img");
        img.className = "fva-popup__img";
        img.src = props.popup_img;
        img.setAttribute("data-full", props.popup_img);
        img.alt = props.popup_name || "";
        body.appendChild(img);
      }
    }
  </script>
</body>
</html>
