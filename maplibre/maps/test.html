<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>FVA Karten – Testübersicht</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: #fafafa;
      color: #222;
    }
    h1 { margin-top: 0; }
    p.hinweis {
      color: #666;
      font-size: 13px;
      max-width: 640px;
    }
    .karte {
      margin-bottom: 32px;
    }
    .karte h2 {
      font-size: 15px;
      margin: 0 0 8px 0;
      color: #006e60;
    }
    /* Einbettung wie auf der FVA-Website (fixe iframe-Maße, Rahmen, Radius). */
    .karte iframe {
      display: block;
      height: 600px;
      width: 820px;
      max-width: 100%;
      border: 1px solid darkgrey;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h1>FVA Karten – Testübersicht</h1>
  <p class="hinweis">
    Bindet alle Karten aus diesem Ordner per <code>&lt;iframe&gt;</code> ein –
    analog zur Einbindung auf der FVA-Website (fixe Maße 820&nbsp;×&nbsp;600,
    <code>loading="lazy"</code>). Neue Karte hinzufügen: Datei in diesen Ordner
    legen und einen Eintrag im <code>MAPS</code>-Array unten in dieser Datei
    ergänzen.
  </p>

  <div id="karten"></div>

  <script>
    // Kartenliste. height ist optional (Standard 600, passend zur Website-Einbindung).
    const MAPS = [
      { file: "karte_basemap.html", title: "Basemap (Referenz, ohne Fachdaten)" },
      { file: "karte_wrw.html",     title: "Wasserrückhalt im Wald (WRW)" },
      { file: "karte_eps.html",     title: "Eichenprozessionsspinner (EPS)" },
      { file: "karte_level2.html",  title: "Level II Bodenfeuchtemonitoring" },
    ];

    const container = document.getElementById("karten");

    MAPS.forEach((k) => {
      const wrap = document.createElement("div");
      wrap.className = "karte";

      const h2 = document.createElement("h2");
      h2.textContent = k.title + " (" + k.file + ")";
      wrap.appendChild(h2);

      const iframe = document.createElement("iframe");
      iframe.src = "./" + k.file;
      if (k.height) iframe.style.height = k.height + "px";
      iframe.loading = "lazy";
      iframe.title = k.file;
      iframe.setAttribute("frameborder", "3");
      wrap.appendChild(iframe);

      container.appendChild(wrap);
    });
  </script>
</body>
</html>
