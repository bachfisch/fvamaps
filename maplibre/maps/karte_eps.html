// cursor:"crosshair" - Klick-zum-Abfragen-Karte statt Feature-Hover.

// -- Timeline: Termine per WMS GetCapabilities, mit Fallback -------------

function buildTimelineFallback() {
  const dates = [];
  const today = new Date(getToday());
  for (let offset = -7; offset <= 4; offset++) {
    const day = new Date(today);
    day.setDate(today.getDate() + offset);
    dates.push(day.toISOString().split('T')[0] + "T00:00:00.000Z");
  }
  return dates;
}

let TIMELINE_DATES       = buildTimelineFallback();
let TIMELINE_TODAY_INDEX = 7;

async function fetchAvailableDates() {
  const layerName = WMS_LAYER_CONFIGS["Entwicklungsstadien"].layerName;
  const url = WMS_BASE_URL + new URLSearchParams({
    SERVICE: "WMS", VERSION: "1.3.0", REQUEST: "GetCapabilities"
  });
  try {
    const res  = await fetch(url);
    const text = await res.text();
    const doc  = new DOMParser().parseFromString(text, "text/xml");

    // Find the Layer matching our layer name — server omits the workspace prefix
    const allNames  = [...doc.querySelectorAll("Name")];
    const shortName = layerName.includes(':') ? layerName.split(':')[1] : layerName;
    const match     = allNames.find(n => n.textContent.trim() === shortName);
    if (!match) {
      console.warn('[Timeline] Layer not found in capabilities:', layerName);
      return null;
    }

    const layerEl = match.parentElement;
    const timeDim = layerEl.querySelector("Dimension[name='time'], Extent[name='time']");
    if (!timeDim) {
      console.warn('[Timeline] No time dimension found for layer');
      return null;
    }

    const raw = timeDim.textContent.trim();

    // Format 1: comma-separated list of ISO dates
    if (raw.includes(',')) {
      return raw.split(',').map(d => d.trim()).filter(Boolean);
    }

    // Format 2: period range "start/end/resolution"
    if (raw.includes('/')) {
      const parts = raw.split('/');
      const start = new Date(parts[0].trim());
      const end   = new Date(parts[1].trim());
      const res   = parts[2]?.trim() || 'P1D';
      const stepMs = res === 'P1M'
        ? null
        : (parseInt(res.replace(/[^0-9]/g, '')) || 1) * 24 * 60 * 60 * 1000;

      const dates = [];
      if (res === 'P1M') {
        const d = new Date(start);
        while (d <= end) {
          dates.push(d.toISOString().replace(/\.\d{3}Z$/, 'Z'));
          d.setMonth(d.getMonth() + 1);
        }
      } else {
        const d = new Date(start);
        while (d <= end) {
          dates.push(d.toISOString().replace(/\.\d{3}Z$/, 'Z'));
          d.setTime(d.getTime() + stepMs);
        }
      }
      return dates.length ? dates : null;
    }

    // Format 3: single date
    return [raw];

  } catch (e) {
    console.error('[Timeline] GetCapabilities failed:', e);
    return null;
  }
}

// Returns dates filtered to the previous year + current year
function filterToRecentYears(dates, n = 1) {
  const today     = getToday();
  const thisYear  = new Date(today).getFullYear();
  const firstYear = thisYear - n;
  const cutoff    = `${firstYear}-01-01`;
  return dates.filter(d => d.slice(0, 10) >= cutoff);
}

function rebuildTimeline(dates) {
  const today = getToday();
  let todayIdx = 0;
  for (let i = 0; i < dates.length; i++) {
    if (dates[i].slice(0, 10) <= today) todayIdx = i;
    else break;
  }
  TIMELINE_DATES       = dates;
  TIMELINE_TODAY_INDEX = todayIdx;
  const slider = document.getElementById('timeline-slider');
  if (!slider) return;
  slider.max   = dates.length - 1;
  slider.value = todayIdx;
  buildYearMarkers();
  updateSliderTrackFill();
  showLayer(selectedLayerKey, todayIdx);
}

// -- WMS-Kacheln (Layer auf der Karte) -------------------------------------

// Builds a WMS GetMap tile URL template. MapLibre understands the special
// "{bbox-epsg-3857}" token in raster source `tiles` URLs and fills it in
// per-tile with "minx,miny,maxx,maxy" in Web Mercator.
function buildWmsTileUrl(config, isoDateString) {
  const params = new URLSearchParams({
    SERVICE:     "WMS",
    VERSION:     "1.3.0",
    REQUEST:     "GetMap",
    FORMAT:      "image/png",
    TRANSPARENT: "true",
    LAYERS:      config.layerName,
    STYLES:      config.style,
    CRS:         "EPSG:3857",
    WIDTH:       "256",
    HEIGHT:      "256",
    TIME:        isoDateString
  });
  if (config.dimEvent !== null) params.set("dim_event", config.dimEvent);
  return `${WMS_BASE_URL}${params.toString()}&BBOX={bbox-epsg-3857}`;
}

let activeLayerId    = null;
let activeLegend      = null;
let selectedLayerKey  = "Entwicklungsstadien";
let wmsLayerCounter   = 0;

function showLayer(layerKey, timelineIndex) {
  const config  = WMS_LAYER_CONFIGS[layerKey];
  const isoDate = TIMELINE_DATES[timelineIndex];
  if (!isoDate) return;

  // Add new layer/source at opacity 0, reveal only once tiles are loaded.
  // MapLibre sources/layers need unique ids, so each date+layer combo gets one.
  const newId = `wms-layer-${wmsLayerCounter++}`;
  map.addSource(newId, {
    type:     'raster',
    tiles:    [buildWmsTileUrl(config, isoDate)],
    tileSize: 256
  });
  map.addLayer({
    id:     newId,
    type:   'raster',
    source: newId,
    paint:  { 'raster-opacity': 0 }
  });

  const oldId   = activeLayerId;
  activeLayerId = newId;

  let revealed = false;
  const reveal = () => {
    if (revealed) return;
    revealed = true;
    if (map.getLayer(newId)) map.setPaintProperty(newId, 'raster-opacity', config.opacity);
    if (oldId && map.getLayer(oldId)) { map.removeLayer(oldId); map.removeSource(oldId); }
  };

  const onSourceData = (e) => {
    if (e.sourceId === newId && map.isSourceLoaded(newId)) {
      map.off('sourcedata', onSourceData);
      reveal();
    }
  };
  map.on('sourcedata', onSourceData);

  // Fallback: reveal after 3s regardless
  setTimeout(() => {
    map.off('sourcedata', onSourceData);
    reveal();
  }, 3000);

  if (activeLegend) map.removeControl(activeLegend);
  const legendNote = layerKey === 'Regulierungsmöglichkeiten'
    ? 'Präventiv bedeutet hier eine Behandlung vor Ausbildung größerer Brennhaar-Mengen.<br>' +
      'Mechanische Maßnahmen (Entfernung von Nestern) zur Reduktion der Brennhaarquelle sind ganzjährig möglich.'
    : undefined;
  activeLegend = FVAMap.addLegend(map, {
    title: layerKey,
    items: Object.values(config.legend).map(s => ({ color: s.color, label: s.label })),
    note: legendNote,
  });

  document.getElementById('date-display').textContent = formatDateGerman(isoDate.split('T')[0]);
}

function buildYearMarkers() {
  const labelsEl = document.getElementById('tl-year-labels');
  if (!labelsEl) return;
  labelsEl.innerHTML = '';

  const total = TIMELINE_DATES.length;
  const years = {};
  TIMELINE_DATES.forEach((iso, i) => {
    const y = iso.slice(0, 4);
    if (!years[y]) years[y] = { first: i, last: i };
    else years[y].last = i;
  });

  Object.entries(years).forEach(([year, { first, last }]) => {
    const midIdx  = (first + last) / 2;
    const midPct  = midIdx / (total - 1) * 100;

    const lbl = document.createElement('div');
    lbl.className   = 'tl-year-label';
    lbl.textContent = year;
    lbl.style.left  = `${midPct}%`;
    labelsEl.appendChild(lbl);

    if (first > 0) {
      const divPct = (first - 0.5) / (total - 1) * 100;
      const div    = document.createElement('div');
      div.className  = 'tl-year-divider';
      div.style.left = `${divPct}%`;
      labelsEl.appendChild(div);
    }
  });
}

function updateSliderTrackFill() {
  const pct   = (+timelineSlider.value - +timelineSlider.min)
              / (+timelineSlider.max   - +timelineSlider.min) * 100;
  const track = document.getElementById('tl-track');
  if (track) track.style.background =
    `linear-gradient(to right, var(--fva-green) 0%, var(--fva-green) ${pct}%, #ddd ${pct}%, #ddd 100%)`;
}

  timelineSlider.value = idx;

}

// Builds the chart date range for a given year (Jan 31 – Sep 30) — always full range
function buildChartDates(year) {
  const dates = [];
  const start = new Date(`${year}-01-31`);
  const end   = new Date(`${year}-09-30`);
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    dates.push(d.toISOString().split('T')[0]);
  }
  return dates;
}

// Returns the dates actually fetched from WMS — capped at today + 6 days
function buildFetchDates(dates) {
  const cap = new Date(getToday());
  cap.setDate(cap.getDate() + 6);
  const capStr = cap.toISOString().split('T')[0];
  return dates.filter(d => d <= capStr);
}

async function loadAndRenderChart(latlng) {
  const year       = +yearSelect.value;
  const dates      = buildChartDates(year);       // full Jan 31 – Sep 30 axis
  const fetchDates = buildFetchDates(dates);      // capped at today + 6 for WMS

  // 1. Popup sofort mit Skelett zeigen, Tabelle leeren. Nur bei einem
  //    frischen Klick (Popup noch nicht offen) auf den Grafik-Tab
  //    zurücksetzen - ein Jahreswechsel soll den gerade aktiven Tab behalten.
  epsTableBodyEl.innerHTML = '';
  if (!FVAMap.popup.isOpen()) switchTab('gantt-panel');
  drawChartSkeleton(dates);
  showLoadingOverlay();
  openEpsPopup();

  // 2. Fetch chart data (capped) + BBCH phenology dates in parallel
  try {
    const [chartData, bbch] = await Promise.all([
      fetchAllChartData(latlng, fetchDates),
      fetchBbchDates(latlng, year)
    ]);
    // Pad fetched arrays back to full dates length with nulls
    const pad = (arr) => {
      const padded = Array(dates.length).fill(null);
      arr.forEach((v, i) => { padded[i] = v; });
      return padded;
    };
    const stagesMean = pad(chartData.stagesMean);
    const stagesFast = pad(chartData.stagesFast);
    const regulation = pad(chartData.regulation);
    fillChartData(dates, stagesMean, stagesFast, regulation);
    fillTableData(dates, stagesMean, stagesFast, regulation, bbch);
  } catch (err) {
    console.error(err);
    ganttWrapEl.innerHTML = '<p class="fva-popup__hint" style="color:#c00">Fehler beim Laden der Daten.</p>';
  } finally {
    hideLoadingOverlay();
  }
}

function lightenColor(hex, amount) {
  const num = parseInt(hex.replace('#', ''), 16);
  const r   = (num >> 16);
  const g   = (num >> 8) & 0x00FF;
  const b   =  num       & 0x0000FF;
  return '#' + (0x1000000
    + (Math.round(r + (255 - r) * amount) << 16)
    + (Math.round(g + (255 - g) * amount) <<  8)
    +  Math.round(b + (255 - b) * amount))
    .toString(16).slice(1);
}

// ── WMS GetFeatureInfo FETCHING (used by the popup) ──

// WGS84 → Gauß-Krüger Zone 3 (EPSG:31467)
// Uses Transverse Mercator on the Bessel 1841 ellipsoid with Potsdam datum shift
function wgs84ToGK3(lat, lng) {
  // Helmert datum shift: WGS84 → Potsdam (approx, sufficient for GetFeatureInfo bbox)
  const dX = -582, dY = -105, dZ = -414;

  const a   = 6378137.0;          // WGS84 semi-major
  const f   = 1 / 298.257223563;  // WGS84 flattening
  const b   = a * (1 - f);
  const e2  = 1 - (b * b) / (a * a);

  const latR = lat * Math.PI / 180;
  const lngR = lng * Math.PI / 180;

  const sinLat = Math.sin(latR);
  const cosLat = Math.cos(latR);
  const N0 = a / Math.sqrt(1 - e2 * sinLat * sinLat);

  // Cartesian WGS84
  const X = N0 * cosLat * Math.cos(lngR);
  const Y = N0 * cosLat * Math.sin(lngR);
  const Z = N0 * (1 - e2) * sinLat;

  // Shift to Potsdam
  const Xp = X + dX, Yp = Y + dY, Zp = Z + dZ;

  // Bessel 1841 ellipsoid
  const aB  = 6377397.155;
  const fB  = 1 / 299.1528128;
  const bB  = aB * (1 - fB);
  const e2B = 1 - (bB * bB) / (aB * aB);

  const p      = Math.sqrt(Xp * Xp + Yp * Yp);
  const latB   = Math.atan2(Zp, p * (1 - e2B));  // initial approx
  let latBi    = latB;
  for (let i = 0; i < 10; i++) {
    const s  = Math.sin(latBi);
    const NB = aB / Math.sqrt(1 - e2B * s * s);
    latBi    = Math.atan2(Zp + e2B * NB * Math.sin(latBi), p);
  }
  const lngB = Math.atan2(Yp, Xp);
  const sinLB = Math.sin(latBi), cosLB = Math.cos(latBi);
  const NB    = aB / Math.sqrt(1 - e2B * sinLB * sinLB);

  // Transverse Mercator onto GK zone 3 (central meridian 9°, false easting 3 500 000)
  const lngCM = 9 * Math.PI / 180;
  const dl    = lngB - lngCM;
  const n     = (aB - bB) / (aB + bB);
  const n2    = n * n, n3 = n * n2, n4 = n2 * n2;

  const A0 = 1 + n2 / 4 + n4 / 64;
  const A2 = 3/2  * (n - n3 / 8);
  const A4 = 15/16 * (n2 - n4 / 4);
  const A6 = 35/48 * n3;
  const A8 = 315/512 * n4;

  const G  = aB / (1 + n) * (A0 * latBi - A2 * Math.sin(2 * latBi) + A4 * Math.sin(4 * latBi) - A6 * Math.sin(6 * latBi) + A8 * Math.sin(8 * latBi));
  const t  = Math.tan(latBi);
  const eta2 = e2B / (1 - e2B) * cosLB * cosLB;
  const V  = NB * cosLB;

  const easting  = 3500000
    + (V * dl)
    + (V / 6   * dl * dl * dl * (1 - t * t + eta2))
    + (V / 120 * dl * dl * dl * dl * dl * (5 - 18 * t * t + t * t * t * t + 14 * eta2 - 58 * t * t * eta2));

  const northing = G
    + (NB * sinLB * cosLB / 2 * dl * dl)
    + (NB * sinLB * cosLB * cosLB * cosLB / 24 * (5 - t * t + 9 * eta2 + 4 * eta2 * eta2) * dl * dl * dl * dl);

  return [easting, northing];
}

// WGS84 → Web Mercator (EPSG:3857)
function wgs84ToWebMercator(lat, lng) {
  const R   = 6378137.0;
  const x   = R * lng * Math.PI / 180;
  const y   = R * Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360));
  return [x, y];
}

// Returns an array of numeric values (or null) aligned to `dates`, via a single time-range request
async function fetchValuesForDates(layerName, dimEvent, bbox, dates) {
  const params = new URLSearchParams({
    SERVICE:       "WMS",
    VERSION:       "1.1.1",
    REQUEST:       "GetFeatureInfo",
    FORMAT:        "image/png",
    TRANSPARENT:   "true",
    INFO_FORMAT:   "application/json",
    FEATURE_COUNT: "9999",
    X: "50", Y: "50",
    SRS:         "EPSG:31467",
    WIDTH: "101", HEIGHT: "101",
    BBOX:        bbox,
    TIME:        `${dates[0]}T00:00:00Z/${dates[dates.length - 1]}T23:59:59Z`,
    LAYERS:      layerName,
    QUERY_LAYERS: layerName,
    DIM_EVENT:   dimEvent
  });

  try {
    const res  = await fetch(WMS_BASE_URL + params);
    const data = await res.json();
    return dates.map(date => {
      const feature = data.features?.find(f => f.properties?.TIME?.startsWith(date));
      if (!feature) return null;
      const v = feature.properties.RESULT_VALUE
             ?? feature.properties.value
             ?? feature.properties.VALUE;
      return (v === null || v === undefined || v === -9999) ? null : v;
    });
  } catch {
    return Array(dates.length).fill(null);
  }
}

// Fetches all chart series defined in WMS_CHART_SERIES in parallel
async function fetchAllChartData(latlng, dates) {
  const [gkEasting, gkNorthing] = wgs84ToGK3(latlng.lat, latlng.lng);
  const half = 1000;
  const bbox = `${gkEasting-half},${gkNorthing-half},${gkEasting+half},${gkNorthing+half}`;

  const entries  = Object.entries(WMS_CHART_SERIES);
  const results  = await Promise.all(
    entries.map(([, series]) => fetchValuesForDates(series.layerName, series.dimEvent, bbox, dates))
  );

  return Object.fromEntries(entries.map(([key], i) => [key, results[i]]));
}

// Fetches a single BBCH phenology date (Knospenschwellen / Blattentfaltung).
// Returns an ISO date string like "2026-04-15" or null.
async function fetchBbchDate(dimEvent, bbox, year) {
  const BBCH_LAYER = "CDC-PHENO:GRD_DEU_P1Y_BBCH";
  const params = new URLSearchParams({
    SERVICE:       "WMS",
    VERSION:       "1.1.1",
    REQUEST:       "GetFeatureInfo",
    FORMAT:        "application/json",
    TRANSPARENT:   "true",
    INFO_FORMAT:   "application/json",
    FEATURE_COUNT: "50",
    X: "50", Y: "50",
    SRS:          "EPSG:31467",
    WIDTH: "101", HEIGHT: "101",
    BBOX:         bbox,
    TIME:         `${year}-01-01T00:00:00Z`,
    LAYERS:       BBCH_LAYER,
    QUERY_LAYERS: BBCH_LAYER,
    DIM_EVENT:    dimEvent,
    DIM_LINEAGE:  "1"
  });
  try {
    const res  = await fetch(WMS_BASE_URL + params);
    const data = await res.json();
    const feature = data.features?.[0];
    if (!feature) return null;
    const v = feature.properties.RESULT_VALUE
           ?? feature.properties.value
           ?? feature.properties.VALUE;
    if (v === null || v === undefined || v === -9999) return null;
    // Value may be a day-of-year integer or an ISO date string
    if (typeof v === 'number') {
      const d = new Date(year, 0, 1);
      d.setDate(d.getDate() + Math.round(v) - 1);
      return d.toISOString().split('T')[0];
    }
    return String(v).split('T')[0];
  } catch {
    return null;
  }
}

// Fetches BBCH dates (Knospenschwellen + Blattentfaltung) + mortality in parallel
async function fetchBbchDates(latlng, year) {
  const [gkEasting, gkNorthing] = wgs84ToGK3(latlng.lat, latlng.lng);
  const half = 1000;
  const bbox = `${gkEasting-half},${gkNorthing-half},${gkEasting+half},${gkNorthing+half}`;
  const [knospenschwellen, blattentfaltung, mortality] = await Promise.all([
    fetchBbchDate(68, bbox, year),
    fetchBbchDate(4,  bbox, year),
    fetchSingleValue("CDC-PHENO:GRD_DEU_P1Y_MORTALITY_THAUPROC", 225, bbox, year)
  ]);
  return { knospenschwellen, blattentfaltung, mortality };
}

// Fetches a single numeric value (no DIM_LINEAGE) — used for mortality etc.
async function fetchSingleValue(layerName, dimEvent, bbox, year) {
  const params = new URLSearchParams({
    SERVICE:       "WMS",
    VERSION:       "1.1.1",
    REQUEST:       "GetFeatureInfo",
    FORMAT:        "application/json",
    TRANSPARENT:   "true",
    INFO_FORMAT:   "application/json",
    FEATURE_COUNT: "50",
    X: "50", Y: "50",
    SRS:          "EPSG:31467",
    WIDTH: "101", HEIGHT: "101",
    BBOX:         bbox,
    TIME:         `${year}-01-01T00:00:00Z`,
    LAYERS:       layerName,
    QUERY_LAYERS: layerName,
    DIM_EVENT:    dimEvent
  });
  try {
    const res  = await fetch(WMS_BASE_URL + params);
    const data = await res.json();
    const feature = data.features?.[0];
    if (!feature) return null;
    const v = feature.properties.RESULT_VALUE
           ?? feature.properties.value
           ?? feature.properties.VALUE;
    return (v === null || v === undefined || v === -9999) ? null : +v;
  } catch {
    return null;
  }
}

// ── CHART DATA PROCESSING (pure functions, no rendering) ──

// Collapses a value-per-date array into continuous same-value intervals, skipping nulls
function buildIntervals(dates, values) {
  const intervals  = [];
  let currentValue = values[0];
  let startIndex   = 0;

  for (let i = 1; i < values.length; i++) {
    if (values[i] !== currentValue) {
      if (currentValue !== null) {
        intervals.push({ stage: currentValue, startDate: dates[startIndex], endDate: dates[i - 1] });
      }
      currentValue = values[i];
      startIndex   = i;
    }
  }
  if (currentValue !== null) {
    intervals.push({ stage: currentValue, startDate: dates[startIndex], endDate: dates[dates.length - 1] });
  }
  return intervals;
}

// Collapses regulation values into stripe intervals for a given set of active regulation values
function buildRegulationStripes(dates, values, activeValues) {
  const stripes   = [];
  let stripeStart = null;

  values.forEach((v, i) => {
    const isActive = v !== null && activeValues.includes(v);
    if (isActive && stripeStart === null) {
      stripeStart = dates[i];
    } else if (!isActive && stripeStart !== null) {
      stripes.push({ start: stripeStart, end: dates[i - 1], value: values[i - 1] });
      stripeStart = null;
    }
  });
  if (stripeStart !== null) {
    stripes.push({ start: stripeStart, end: dates[dates.length - 1], value: values[values.length - 1] });
  }
  return stripes;
}

// Detects the Brennhaar health hazard period:
//   start = first occurrence of stage 3 in fast development
//   end   = first occurrence of stage 7 (pupa) in mean development
function buildHealthHazardPhases(dates, stagesFast, stagesMean) {
  const years  = [...new Set(dates.map(d => d.slice(0, 4)))];
  const phases = [];

  // Find the last date that actually has data (non-null in either series)
  let lastDataDate = null;
  for (let i = dates.length - 1; i >= 0; i--) {
    if (stagesFast[i] !== null || stagesMean[i] !== null) {
      lastDataDate = dates[i];
      break;
    }
  }

  for (const year of years) {
    const firstMatch = (values, matchFn) => {
      for (let i = 0; i < dates.length; i++) {
        if (dates[i].startsWith(year) && matchFn(values[i])) return dates[i];
      }
      return null;
    };

    const hazardStart = firstMatch(stagesFast, v => v === 3);
    const hazardEnd   = firstMatch(stagesMean, v => v === 7);

    if (hazardStart && hazardEnd && hazardEnd > hazardStart) {
      phases.push({ start: hazardStart, end: hazardEnd });
    } else if (hazardStart && !hazardEnd) {
      // Cap at last date with actual data so fade-out works correctly
      const capDate = lastDataDate
        || dates.filter(d => d.startsWith(year)).pop();
      if (capDate) phases.push({ start: hazardStart, end: capDate });
    }
  }
  return phases;
}

// ── GANTT CHART RENDERER: layout → skeleton (axes/grid) → data layers → tooltip ──

/** Tiny SVG helpers — keep markup in one place */
const svg = {
  rect: (x, y, w, h, attrs = '') =>
    `<rect x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" width="${Math.max(2, +w).toFixed(1)}" height="${h}" ${attrs}/>`,
  line: (x1, y1, x2, y2, attrs = '') =>
    `<line x1="${(+x1).toFixed(1)}" y1="${(+y1).toFixed(1)}" x2="${(+x2).toFixed(1)}" y2="${(+y2).toFixed(1)}" ${attrs}/>`,
  text: (x, y, content, attrs = '') =>
    `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" ${attrs}>${content}</text>`,
};

function buildChartLayout(dates) {
  const SVG_WIDTH    = 820;
  const BAR_HEIGHT   = 36;
  const LABEL_WIDTH  = 130;
  const PADDING_TOP  = 36;
  const INNER_WIDTH  = SVG_WIDTH - LABEL_WIDTH;
  const CHART_HEIGHT = STAGE_RENDER_ORDER.length * BAR_HEIGHT;
  const SVG_HEIGHT   = PADDING_TOP + CHART_HEIGHT + 28;

  const startDate = new Date(dates[0]);
  const totalMs   = new Date(dates[dates.length - 1]) - startDate || 1;
  const dayWidth  = INNER_WIDTH / dates.length;
  const dateToX   = dateStr =>
    LABEL_WIDTH + ((new Date(dateStr) - startDate) / totalMs) * INNER_WIDTH;

  return { SVG_WIDTH, BAR_HEIGHT, LABEL_WIDTH, PADDING_TOP, INNER_WIDTH,
           CHART_HEIGHT, SVG_HEIGHT, dayWidth, dateToX };
}

// Renders the static chart skeleton (axes, grid, labels) — needs no fetched data
function drawChartSkeleton(dates) {
  const { SVG_WIDTH, BAR_HEIGHT, LABEL_WIDTH, PADDING_TOP, INNER_WIDTH,
          CHART_HEIGHT, SVG_HEIGHT, dateToX } = buildChartLayout(dates);

  const todayStr     = getToday();
  const selectedYear = +yearSelect.value;
  const MONTH_NAMES  = ['Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep'];

  const todayX = (todayStr >= dates[0] && todayStr <= dates[dates.length - 1])
    ? dateToX(todayStr) : null;

  const monthGridLines = MONTH_NAMES.map((name, i) => {
    const monthIndex = i + 1;
    return {
      tickX:  dateToX(new Date(selectedYear, monthIndex, 1).toISOString().split('T')[0]),
      labelX: dateToX(new Date(selectedYear, monthIndex, 15).toISOString().split('T')[0]),
      name
    };
  });

  const zebraRows = STAGE_RENDER_ORDER.map((_, row) => {
    const y = PADDING_TOP + row * BAR_HEIGHT;
    return `<rect x="${LABEL_WIDTH}" y="${y}" width="${INNER_WIDTH}" height="${BAR_HEIGHT}"
      fill="${row % 2 === 0 ? '#fafafa' : '#f3f3f3'}"/>`;
  }).join('');

  const yAxisLabels = STAGE_RENDER_ORDER.map((stageId, row) => {
    const y = PADDING_TOP + row * BAR_HEIGHT;
    const s = LEGENDS.stages[stageId];
    return `
      <circle cx="10" cy="${y + BAR_HEIGHT / 2}" r="5"
        fill="${s.color}" stroke="#bbb" stroke-width="0.5"/>
      <text x="22" y="${y + BAR_HEIGHT / 2 + 4}" font-size="10.5" fill="#444">${s.label}</text>`;
  }).join('');

  const gridLines = monthGridLines.map(({ tickX, labelX, name }) => `
    <line x1="${tickX.toFixed(1)}" y1="${PADDING_TOP}"
          x2="${tickX.toFixed(1)}" y2="${PADDING_TOP + CHART_HEIGHT}"
          stroke="#aaa" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="${labelX.toFixed(1)}" y="${PADDING_TOP - 6}"
      text-anchor="middle" font-size="9.5" fill="#555" font-weight="700">${name}</text>
  `).join('');

  const todayLine = todayX ? `
    <line x1="${todayX.toFixed(1)}" y1="${PADDING_TOP - 4}"
          x2="${todayX.toFixed(1)}" y2="${PADDING_TOP + CHART_HEIGHT + 4}"
          style="stroke:var(--fva-green)" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="${(todayX + 3).toFixed(1)}" y="${PADDING_TOP - 18}"
      font-size="9" style="fill:var(--fva-green)" font-weight="600">Heute</text>` : '';

  const clipId = 'clip-' + Date.now();

  ganttLegendEl.innerHTML = `
    <div class="legend-item">
      <div class="legend-swatch" style="background:repeating-linear-gradient(90deg,#6BAF6688 0 6px,transparent 6px 10px)"></div>
      <span>Präventiv zielführend</span>
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background:repeating-linear-gradient(90deg,#00833E88 0 6px,transparent 6px 10px)"></div>
      <span>Mechanisch zielführend</span>
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background:#888; opacity:0.35"></div>
      <span>Schnelle Entwicklung</span>
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background:#E6001A; opacity:0.25"></div>
      <span>Gesundheitsgefährdung Brennhaare</span>
    </div>
    <p class="legend-note"></p>`;

  ganttWrapEl.innerHTML = `
  <svg viewBox="0 0 ${SVG_WIDTH} ${SVG_HEIGHT}"
       style="font-family:'Segoe UI',sans-serif; width:100%; min-width:500px">

    <defs>
      <clipPath id="${clipId}">
        <rect x="${LABEL_WIDTH}" y="${PADDING_TOP}" width="${INNER_WIDTH}" height="${CHART_HEIGHT}"/>
      </clipPath>
      <pattern id="hatch-1" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
        <rect width="8" height="8" fill="#6BAF66" fill-opacity="0.12"/>
        <line x1="0" y1="0" x2="0" y2="8" stroke="#6BAF66" stroke-width="3" stroke-opacity="0.55"/>
      </pattern>
      <pattern id="hatch-3" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
        <rect width="8" height="8" fill="#00833E" fill-opacity="0.12"/>
        <line x1="0" y1="0" x2="0" y2="8" stroke="#00833E" stroke-width="3" stroke-opacity="0.55"/>
      </pattern>
      <!-- fade-out mask: opaque at today, transparent at end -->
      <linearGradient id="fade-mask-grad" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0%" stop-color="white" stop-opacity="1"/>
        <stop offset="100%" stop-color="white" stop-opacity="0"/>
      </linearGradient>
      <mask id="fade-mask-today" maskContentUnits="objectBoundingBox">
        <rect width="1" height="1" fill="url(#fade-mask-grad)"/>
      </mask>
    </defs>

    ${zebraRows}
    ${gridLines}

    <!-- data layers injected here after fetch -->
    <g id="gantt-data-layer" clip-path="url(#${clipId})"></g>

    <rect x="${LABEL_WIDTH}" y="${PADDING_TOP}" width="${INNER_WIDTH}" height="${CHART_HEIGHT}"
      fill="none" stroke="#ccc" stroke-width="1"/>

    ${yAxisLabels}
    ${todayLine}

  </svg>`;
}

// Injects the fetched data (bars, stripes, health hazard) into the existing skeleton SVG
function fillChartData(dates, stagesMean, stagesFast, regulation) {
  const intervalsMean = buildIntervals(dates, stagesMean);
  const intervalsFast = buildIntervals(dates, stagesFast);

  const dataLayer = ganttWrapEl.querySelector('#gantt-data-layer');
  if (!dataLayer) return;

  if (!intervalsMean.length) {
    ganttWrapEl.innerHTML = '<p class="fva-popup__hint">Keine Daten für diesen Punkt (außerhalb des Rasters?)</p>';
    return;
  }

  const { BAR_HEIGHT, LABEL_WIDTH, PADDING_TOP, INNER_WIDTH,
          CHART_HEIGHT, dayWidth, dateToX } = buildChartLayout(dates);

  const todayStr = getToday();
  const healthPhases   = buildHealthHazardPhases(dates, stagesFast, stagesMean);
  const todayX = (todayStr >= dates[0] && todayStr <= dates[dates.length - 1])
    ? dateToX(todayStr) : null;

  /** Rect that fades out after "today" when it spans the forecast zone */
  function fadingRect(x1, x2, y, h, fill, extraAttrs = '', rx = 0) {
    const base = `rx="${rx}" fill="${fill}" ${extraAttrs}`;
    if (!todayX || x2 <= todayX || x1 >= todayX) {
      return svg.rect(x1, y, x2 - x1, h, base);
    }
    return svg.rect(x1, y, x2 - x1, h, base)
      + svg.rect(todayX, y, x2 - todayX, h, `fill="${fill}" mask="url(#fade-mask-today)" ${extraAttrs}`);
  }

  function drawHealthHazard() {
    return healthPhases.map(p => fadingRect(
      dateToX(p.start), dateToX(p.end) + dayWidth, PADDING_TOP, CHART_HEIGHT, '#E6001A',
      `class="health-hazard-bg" opacity="0.12" data-start="${p.start}" data-end="${p.end}" data-label="Gesundheitsgefährdung Brennhaare"`
    )).join('');
  }

  function drawRegulationStripes(stripes, regulationValue) {
    const color = LEGENDS.regulation[regulationValue].color;
    const label = LEGENDS.regulation[regulationValue].label;
    return stripes.map(s => fadingRect(
      dateToX(s.start), dateToX(s.end) + dayWidth, PADDING_TOP, CHART_HEIGHT,
      `url(#hatch-${regulationValue})`,
      `class="regulation-stripe" stroke="${color}" stroke-width="0.8" stroke-opacity="0.5" data-label="${label}" data-start="${s.start}" data-end="${s.end}"`
    )).join('');
  }

  function drawStageBars(intervals, opts) {
    const { offsetY, lightenForecast, lightenPast, labelSuffix, stroke } = opts;
    let html = '';
    STAGE_RENDER_ORDER.forEach((stageId, row) => {
      const y = PADDING_TOP + row * BAR_HEIGHT;
      const s = LEGENDS.stages[stageId];
      const h = BAR_HEIGHT - 8;
      intervals.filter(iv => iv.stage === stageId).forEach(iv => {
        const x1 = dateToX(iv.startDate);
        const x2 = dateToX(iv.endDate) + dayWidth;
        const isForecast = iv.startDate > todayStr;
        const fill = lightenColor(s.color, isForecast ? lightenForecast : lightenPast);
        const label = labelSuffix ? `${s.label} ${labelSuffix}` : s.label;
        html += fadingRect(x1, x2, y + 4 + offsetY, h, fill,
          `class="gantt-bar" stroke="${stroke}" stroke-width="0.5" data-label="${label}" data-start="${iv.startDate}" data-end="${iv.endDate}" data-forecast="${isForecast}"`, 3);
      });
    });
    return html;
  }

  dataLayer.innerHTML =
    drawHealthHazard()
    + drawRegulationStripes(buildRegulationStripes(dates, regulation, [1]), 1)
    + drawRegulationStripes(buildRegulationStripes(dates, regulation, [3]), 3)
    + drawStageBars(intervalsFast, {
        offsetY: -Math.round((BAR_HEIGHT - 8) * 0.10),
        lightenForecast: 0.65, lightenPast: 0.35,
        labelSuffix: '(schnell)', stroke: '#0002'
      })
    + drawStageBars(intervalsMean, {
        offsetY: 0,
        lightenForecast: 0.40, lightenPast: 0,  // 0 → full color via lightenColor amount 0
        labelSuffix: '', stroke: '#0003'
      });

  // ── Tooltip wiring (event delegation — one listener, survives re-renders) ──
  ganttWrapEl._ttMove = ganttWrapEl._ttMove || ganttWrapEl.addEventListener('mousemove', e => {
    const el = e.target.closest('[data-label]');
    if (!el) { hideGanttTooltip(); return; }
    const { label, start, end, forecast } = el.dataset;
    const isHazard   = el.classList.contains('health-hazard-bg');
    const forecastTxt = forecast === 'true' ? '<br><em style="color:#aaa">(Forecast)</em>' : '';
    showGanttTooltip(e,
      isHazard
        ? `<strong>Gesundheitsgefährdung Brennhaare</strong><br>${formatDateGerman(start)} – ${formatDateGerman(end)}`
        : `<strong>${label}</strong><br>${formatDateGerman(start)} – ${formatDateGerman(end)}${forecastTxt}`
    );
  });
  ganttWrapEl._ttLeave = ganttWrapEl._ttLeave || ganttWrapEl.addEventListener('mouseleave', hideGanttTooltip);
}

// ── TABLE RENDERER ──

function fillTableData(dates, stagesMean, stagesFast, regulation, bbch) {
  const todayStr      = getToday();
  const intervalsMean = buildIntervals(dates, stagesMean);

  // Start date of a Gantt stage (mean development)
  function stageStart(stageId) {
    const iv = intervalsMean.find(iv => iv.stage === stageId);
    return iv ? iv.startDate : null;
  }

  // Eistadium that appears AFTER the Falter interval (stageId 8)
  function eistadiumAfterFalter() {
    const falterIv = intervalsMean.find(iv => iv.stage === 8);
    if (!falterIv) return null;
    const eiAfter = intervalsMean.find(iv => iv.stage === 0 && iv.startDate > falterIv.startDate);
    return eiAfter ? eiAfter.startDate : null;
  }

  // Fraßbeginn = max(Knospenschwellen, L1 Schlupf) — i.e. whichever is later
  function frassbeginn() {
    const knospen = bbch?.knospenschwellen ?? null;
    const l1      = stageStart(1);
    if (!knospen && !l1) return null;
    if (!knospen) return l1;
    if (!l1) return knospen;
    return knospen >= l1 ? knospen : l1;
  }

  // Build a resolved date for every row
  function resolveDate(row) {
    if (row.key === 'knospenschwellen') return bbch?.knospenschwellen ?? null;
    if (row.key === 'blattentfaltung')  return bbch?.blattentfaltung  ?? null;
    if (row.key === 'frassbeginn')      return frassbeginn();
    if (row.key === 'eistadium')        return eistadiumAfterFalter();
    return row.stageId !== null ? stageStart(row.stageId) : null;
  }

  // Build dynamic info text (mortality injected into L1 Schlupf when Knospenschwellen is known)
  function resolveInfo(row) {
    if (row.key === 'l1schlupf') {
      const hasDatum   = bbch?.knospenschwellen != null;
      const mortalityV = bbch?.mortality;
      const pct = (hasDatum && mortalityV !== null && mortalityV !== undefined)
        ? `${Math.round(mortalityV)} %`
        : (hasDatum ? '– %' : null);
      const mortalityLine = pct
        ? `Mortalität in Hungerphase bis Knospenschwellen: <strong>${pct}</strong>`
        : 'Mortalität in Hungerphase bis Knospenschwellen: –';
      return `Keine Gesundheitsgefahr durch frische Brennhaare,<br>${mortalityLine}`;
    }
    return row.info.replace(/\n/g, '<br>');
  }

  function fmtDate(dateStr) {
    if (!dateStr) return '<span class="cell-empty">–</span>';
    const isForecast = dateStr > todayStr;
    const txt = formatDateGerman(dateStr);
    return isForecast ? `<span class="cell-forecast">${txt}</span>` : txt;
  }

  function tint(hex, alpha = 0.15) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  // Attach resolved dates, then sort: rows with dates first (ascending), nulls after (original order)
  const rowsWithDates = TABLE_ROWS.map((row, originalIndex) => ({
    ...row,
    resolvedDate: resolveDate(row),
    originalIndex
  }));

  const withDate    = rowsWithDates.filter(r => r.resolvedDate !== null).sort((a, b) => a.resolvedDate.localeCompare(b.resolvedDate));
  const withoutDate = rowsWithDates.filter(r => r.resolvedDate === null).sort((a, b) => a.originalIndex - b.originalIndex);
  const sorted      = [...withDate, ...withoutDate];

  epsTableBodyEl.innerHTML = sorted.map(row => {
    const stageColor = row.stageColor ?? LEGENDS.stages[row.stageId]?.color ?? '#AAAAAA';
    const regColor   = LEGENDS.regulation[row.regFixed]?.color ?? '#DDDDDD';
    const stageBg    = tint(stageColor, 0.15);
    const regBg      = tint(regColor,   0.18);

    return `<tr>
      <td class="col-stage" style="background:${stageBg}">${row.label}</td>
      <td class="col-date"  style="background:${stageBg}">${fmtDate(row.resolvedDate)}</td>
      <td class="col-info"  style="background:${stageBg}">${resolveInfo(row)}</td>
      <td class="col-reg"   style="background:${regBg}">${REG_DISPLAY[row.regFixed] ?? '–'}</td>
    </tr>`;
  }).join('');
}

// Fetches municipality name for a clicked point from DWD Warngebiete layer
async function fetchLocationName(latlng) {
  const [mx, my] = wgs84ToWebMercator(latlng.lat, latlng.lng);
  const half     = 1000;
  const bbox     = `${mx - half},${my - half},${mx + half},${my + half}`;
  const params   = new URLSearchParams({
    service:      "WMS",
    version:      "1.1.1",
    request:      "GetFeatureInfo",
    layers:       "Warngebiete_Gemeinden",
    styles:       "",
    srs:          "EPSG:3857",
    bbox,
    width:        "101",
    height:       "101",
    query_layers: "Warngebiete_Gemeinden",
    info_format:  "application/json",
    x:            "50",
    y:            "50"
  });
  try {
    const res  = await fetch("https://maps.dwd.de/geoserver/dwd/wms?" + params);
    const data = await res.json();
    const feat = data.features?.[0];
    if (!feat) return null;
    return feat.properties?.NAME
        || feat.properties?.GEN
        || feat.properties?.name
        || feat.properties?.GEMEINDE
        || null;
  } catch {
    return null;
  }
}
