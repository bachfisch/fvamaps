  <div id="map" class="fva-map"></div>

  <script src="../vendor/maplibre-gl.js"></script>

  <script>
    // Reine Grundkarte – keine fachspezifischen Layer/Popups.

    // Ausgangspunkt beim Anlegen einer neuen karte_*.html.

      container: "map",
      ariaLabel: "Referenzkarte Baden-Württemberg ohne Fachdaten",
      // Kartenausschnitt (ganz BW) kommt aus der Basemap – hier nichts setzen.
      // Nur echte Ausnahmen geben stattdessen center/zoom an.
    });
  </script>
