<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>FVA – Bodenfeuchtemonitoring</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="../vendor/maplibre-gl.css" />
  <link rel="stylesheet" href="../base/basemap.css" />
</head>
<body>
  <div id="map" class="behoerde-map"></div>

  <script src="../vendor/maplibre-gl.js"></script>
  <script src="../base/basemap.js"></script>
  <script>
    /**
     * Bodenfeuchtemonitoring
     * -----------------------------------------------------------------
     * REFERENZ-IMPLEMENTIERUNG des zentralen Live-Daten-Musters aus dem
     * Konzept-Dokument (Abschnitt 6): Die Karte selbst wird nur einmal
     * geladen. Die Zeitreihe im Popup wird bei jedem Klick live aus der
     * aktuellen CSV nachgeladen – die Abteilung muss dafür nur die CSV
     * am bestehenden Pfad ersetzen (aktuell in
     * maps/sample-data/station_*.csv, produktiv am gewohnten Ort auf der
     * Website, z. B. .../daten-tools/monitoring/bodenfeuchtemonitoring/).
     *
     * Platzhalter-Daten: 3 Beispielstationen mit 30 Tagen simulierter
     * Bodenfeuchte in 30 cm und 60 cm Tiefe.
     * -----------------------------------------------------------------
     */

    const STANDORTE_URL = "./sample-data/bodenfeuchte_standorte.geojson";

    const map = BehoerdeMap.create({
      container: "map",
      center: [8.7, 48.4],
      zoom: 7.4,
    });

    map.on("load", () => {
      map.addSource("bodenfeuchte-standorte", { type: "geojson", data: STANDORTE_URL });

      map.addLayer({
        id: "bodenfeuchte-standorte-punkte",
        type: "circle",
        source: "bodenfeuchte-standorte",
        paint: {
          "circle-radius": 7,
          "circle-color": "#2e6f95",
          "circle-stroke-width": 2,
          "circle-stroke-color": "#ffffff",
        },
      });

      map.on("mouseenter", "bodenfeuchte-standorte-punkte", () => (map.getCanvas().style.cursor = "pointer"));
      map.on("mouseleave", "bodenfeuchte-standorte-punkte", () => (map.getCanvas().style.cursor = ""));

      map.on("click", "bodenfeuchte-standorte-punkte", (e) => {
        const f = e.features[0];
        const p = f.properties;
        const coords = f.geometry.coordinates.slice();

        // Same-Origin-Beispiel: Datei liegt neben der Karte. Produktiv
        // zeigt urlPattern auf den bestehenden Ablageort der Abteilung –
        // ein Umzug der Dateien ist nicht nötig (siehe Konzept, Abschnitt 6).
        const csvUrl = `./sample-data/${p.stationId}.csv`;

        BehoerdeMap.openDataPopup(map, coords, {
          title: p.name,
          dataUrl: csvUrl,
          renderChart: renderFeuchteZeitreihe,
        });
      });
    });

    /**
     * Fachspezifische Popup-Grafik: einfacher Linienchart (Canvas, ohne
     * externe Chart-Bibliothek) für zwei Bodenfeuchte-Tiefenstufen.
     * Bei Bedarf hier durch eine mächtigere Bibliothek (z. B. Observable
     * Plot/Vega-Lite, siehe Konzept-Diskussion) ersetzbar – die Anbindung
     * über openDataPopup(...) bliebe unverändert.
     */
    function renderFeuchteZeitreihe(body, data, theme) {
      const wrap = document.createElement("div");
      body.appendChild(wrap);

      const width = 460;
      const height = 200;
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      canvas.style.width = "100%";
      canvas.style.height = "auto";
      wrap.appendChild(canvas);

      const ctx = canvas.getContext("2d");
      const marginLeft = 32;
      const marginBottom = 20;
      const marginTop = 10;
      const plotW = width - marginLeft - 10;
      const plotH = height - marginTop - marginBottom;

      const values30 = data.map((d) => d.feuchte_30cm);
      const values60 = data.map((d) => d.feuchte_60cm);
      const allValues = values30.concat(values60);
      const min = Math.floor(Math.min(...allValues) - 2);
      const max = Math.ceil(Math.max(...allValues) + 2);

      function x(i) { return marginLeft + (i / (data.length - 1)) * plotW; }
      function y(v) { return marginTop + plotH - ((v - min) / (max - min)) * plotH; }

      // Achsen
      ctx.strokeStyle = theme.colorBorder;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(marginLeft, marginTop);
      ctx.lineTo(marginLeft, marginTop + plotH);
      ctx.lineTo(marginLeft + plotW, marginTop + plotH);
      ctx.stroke();

      ctx.fillStyle = theme.colorTextMuted;
      ctx.font = "10px " + theme.fontFamily;
      ctx.fillText(max + "%", 2, marginTop + 8);
      ctx.fillText(min + "%", 2, marginTop + plotH);
      ctx.fillText(data[0].datum, marginLeft, height - 4);
      ctx.fillText(data[data.length - 1].datum, marginLeft + plotW - 60, height - 4);

      function drawLine(values, color) {
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        values.forEach((v, i) => {
          const px = x(i);
          const py = y(v);
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        });
        ctx.stroke();
      }

      drawLine(values30, theme.categorical[0]);
      drawLine(values60, theme.categorical[1]);

      // Mini-Legende
      const legend = document.createElement("div");
      legend.style.display = "flex";
      legend.style.gap = "14px";
      legend.style.marginTop = "6px";
      legend.style.fontSize = "11px";
      legend.innerHTML = `
        <span><span style="display:inline-block;width:10px;height:10px;background:${theme.categorical[0]};border-radius:2px;margin-right:4px;"></span>30 cm Tiefe</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:${theme.categorical[1]};border-radius:2px;margin-right:4px;"></span>60 cm Tiefe</span>
      `;
      wrap.appendChild(legend);

      const latest = data[data.length - 1];
      const note = document.createElement("p");
      note.style.fontSize = "11px";
      note.style.color = theme.colorTextMuted;
      note.style.marginTop = "8px";
      note.textContent =
        `Letzter Messwert (${latest.datum}): ${latest.feuchte_30cm.toFixed(1)}% / ` +
        `${latest.feuchte_60cm.toFixed(1)}%. Diese Grafik wird bei jedem Öffnen live aus ` +
        `der aktuellen CSV-Datei der Station gerendert.`;
      wrap.appendChild(note);
    }
  </script>
</body>
</html>
