<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Level II Bodenfeuchtemonitoring – Karte</title>

  <link rel="stylesheet" href="../vendor/maplibre-gl.css" />
  <link rel="stylesheet" href="../base/basemap.css?v=20260917" />

  <!--
    Nur für diese Karte: Tabs + Grafik im Standort-Popup.
    Bewusst hier und nicht in basemap.css, weil kein anderer Kartentyp
    das (noch) braucht - siehe Kommentar in karte_basemap.html.
  -->
  <style>
    /* .fva-popup--large deckelt normale Popups in basemap.css auf max-width:520px -
       genau richtig für Bild-/Text-Popups, aber hier brauchen wir die volle, per JS
       berechnete Breite (90% der Kartenbreite) für die Plotly-Grafik. Anders als das
       alte Hand-SVG (skalierte sich per viewBox automatisch auf die verfügbare Breite
       runter) rendert Plotly mit einer festen Pixelbreite (layout.width) - ohne diese
       Aufhebung würde die Grafik am 520px-Deckel des Popup-Rahmens abgeschnitten. */
    .fva-popup--level2.fva-popup--large { max-width: none; }

    /* Breite wird pro Popup dynamisch in JS gesetzt (~90% der Kartenbreite);
       das hier ist nur der Fallback, falls JS aus irgendeinem Grund nicht greift.
       max-height/overflow-y aus basemap.css (.fva-popup__body, dort 360px für
       normale, klein bleibende maplibregl.Popups gedacht) hier aufgehoben -
       das umschließende .fva-modal übernimmt diesen Job jetzt selbst
       (max-height:92vh + Scroll). Ohne diese Aufhebung würde die Grafik
       innerhalb des Modals trotzdem bei 360px abgeschnitten/gescrollt,
       unabhängig davon, wie hoch chartHeight berechnet wird. */
    .fva-popup--level2 .fva-popup__body {
      width: 480px;
      max-width: 90vw;
      max-height: none;
      overflow-y: visible;
    }

    .wh-meta { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: #555; margin-bottom: 10px; }
    .wh-meta b { color: #222; }

    /* Tiefen-Tabs + Export-Button in einer Zeile - der Rand/Abstand, den
       vorher .wh-tabs alleine trug, sitzt jetzt hier, damit er über die
       volle Breite (inkl. Button) durchläuft statt nur unter den Tabs. */
    .wh-tabs-row {
      display: flex; align-items: flex-end; gap: 8px;
      border-bottom: 1px solid #ddd; margin-bottom: 8px;
    }
    .wh-tabs { display: flex; gap: 4px; flex: 1; }
    .wh-tab {
      appearance: none; border: none; background: none; cursor: pointer;
      padding: 6px 12px; font-size: 13px; color: #666; border-bottom: 2px solid transparent;
      font-family: inherit;
    }
    .wh-tab:hover { color: #2F6B4F; }
    .wh-tab--active { color: #2F6B4F; border-bottom-color: #2F6B4F; font-weight: 600; }

    /* PNG-Export - gleiche Optik wie #print-btn in karte_eps.html. */
    .wh-export-btn {
      flex-shrink: 0; margin-bottom: 6px;
      background: none; border: 1px solid #ccc; border-radius: 5px;
      padding: 3px 9px; font-size: 12px; font-family: inherit;
      cursor: pointer; color: #555;
    }
    .wh-export-btn:hover { background: #f5f5f5; }
    .wh-export-btn:disabled { cursor: default; opacity: 0.6; }

    /* Der Plot selbst (Achsen, Hover, Crosshair) kommt jetzt komplett von
       Plotly.js - hier nur noch der Rahmen für den Container. */
    .wh-chart { position: relative; }

    .wh-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11px; color: #555; margin-top: 6px; }
    .wh-legend span { display: inline-flex; align-items: center; gap: 4px; }
    .wh-legend i { width: 12px; height: 8px; display: inline-block; border-radius: 2px; flex: none; }
    .wh-legend i.wh-legend--line { height: 2px; border-radius: 0; }

    .wh-hint, .wh-loading { font-size: 13px; color: #777; padding: 10px 0; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="../vendor/maplibre-gl.js"></script>
  <script src="../base/basemap.js?v=20260917"></script>
  <!-- Nur für die Wasserhaushalts-Grafik im Klick-Popup dieser Karte (siehe WHChart unten). -->
  <script src="../vendor/plotly-basic.min.js?v=20260917"></script>
  <!-- PNG-Export der Grafik (siehe exportChartPng unten), wie in karte_eps.html -->
  <script src="../vendor/html-to-image.js?v=20260908"></script>
  <script>
    /**
     * Level II – Bodenfeuchtemonitoring
     * -----------------------------------------------------------------
     * Standorte der Level-II-Flächen (Buche/Fichte, mehrere Bodentiefen je
     * Standort). Klick-Popup zeigt Wasserhaushalt (%nFK) als Grafik mit
     * einem Tab pro Bodentiefe - ersetzt die früheren Einzel-Exporte.
     * Geodaten:
     *   data/level2_standorte.geojson - NUR Standort-Metadaten (label,
     *   popup_name, standort, baumart, hoehe_m, hangneigung_grad, bodentyp).
     *   Punkt-Styling (Farbe/Radius/...) kommt bewusst NICHT von dort, siehe
     *   SPECIES_STYLE unten - das ist immer dasselbe für alle Standorte
     *   einer Baumart, muss also nicht pro Feature in der GeoJSON stehen.
     * Grafikdaten pro Standort (zwei CSVs, wie besprochen):
     *   data/<Standort>_quartal.csv   Referenzverlauf, 1x jährlich neu
     *   data/<Standort>_aktuell.csv   Tageswerte, laufend aktualisiert
     * Ob es für einen Standort eine Grafik gibt, wird NICHT über ein Flag in
     * der GeoJSON entschieden, sondern einfach ausprobiert: CSV lädt ->
     * Grafik, CSV fehlt (404) -> Hinweistext (siehe openStandortPopup).
     * Kartenausschnitt (ganz BW) kommt aus der Basemap; die Legende steht in
     * LEGEND_ITEMS.
     * -----------------------------------------------------------------
     */

    const STANDORTE_URL = "./data/level2_standorte.geojson";
    const DATA_DIR = "./data/";

    // Einzige Quelle für die Punkt-/Legenden-Farben je Baumart - baumart in
    // der GeoJSON ist z.B. auch "Fichte_geduengt" oder "Bannwald_Buche",
    // daher unten ein Substring-Check ("enthält Buche?") statt exaktem
    // Vergleich, siehe circle-color/-stroke-color.
    const SPECIES_STYLE = {
      Buche:  { fill: "#C8E6A0", stroke: "#5B8C3A" },
      Fichte: { fill: "#9FD8C8", stroke: "#2F7A66" },
    };
    const POINT_RADIUS = 7;
    const POINT_FILL_OPACITY = 0.85;
    const POINT_STROKE_WEIGHT = 2;
    const POINT_STROKE_OPACITY = 1;

    const LEGEND_TITLE = "Baumart";
    const LEGEND_ITEMS = Object.entries(SPECIES_STYLE).map(([label, s]) => ({ color: s.fill, label }));

    initMap();

    function initMap() {
      const map = FVAMap.create({
        container: "map",
        // Kartenausschnitt kommt aus der Basemap (Standard: ganz BW).
        ariaLabel: "Level II Bodenfeuchtemonitoring – Standorte und Wasserhaushalt",
      });

      const tooltip = FVAMap.createHoverTooltip(map);

      map.on("load", () => {
        map.addSource("standorte", { type: "geojson", data: STANDORTE_URL, generateId: true });

        // Diagnose: prüft einmalig, ob die geladenen Features das erwartete
        // Schema haben (label/popup_name/standort/baumart).
        // Meldet sich laut in der Konsole, statt später still "undefined" zu zeigen.
        map.once("sourcedata", function checkSchema(e) {
          if (e.sourceId !== "standorte" || !map.isSourceLoaded("standorte")) return;
          map.off("sourcedata", checkSchema);
          const feats = map.querySourceFeatures("standorte");
          if (!feats.length) {
            console.error(
              `[karte_level2] "${STANDORTE_URL}" lieferte 0 Features. ` +
              `Prüfen: liegt die Datei wirklich unter diesem Pfad (Netzwerk-Tab, Status 200)?`
            );
            return;
          }
          const p = feats[0].properties;
          const required = ["label", "popup_name", "standort", "baumart"];
          const missing = required.filter((k) => !(k in p));
          if (missing.length) {
            console.error(
              `[karte_level2] "${STANDORTE_URL}" hat nicht das erwartete Schema - ` +
              `es fehlen: ${missing.join(", ")}. Vermutlich liegt hier noch eine ältere ` +
              `geojson-Version (z.B. das ursprüngliche "standorte.geojson") statt der für ` +
              `diese Karte erzeugten "level2_standorte.geojson". Gefundene properties:`, p
            );
          }
        });

        // Farben kommen aus SPECIES_STYLE, nicht aus der GeoJSON - "in" prüft
        // hier auf Teilstring (baumart kann z.B. "Bannwald_Buche" oder
        // "Fichte_geduengt" sein), Radius/Opazität/Strichstärke sind für
        // jeden Standort ohnehin gleich (feste Konstanten oben).
        const isBuche = ["in", "Buche", ["get", "baumart"]];
        map.addLayer({
          id: "standorte-punkte",
          type: "circle",
          source: "standorte",
          paint: {
            "circle-radius": [
              "case", ["boolean", ["feature-state", "hover"], false],
              POINT_RADIUS + 4, POINT_RADIUS,
            ],
            "circle-color": ["case", isBuche, SPECIES_STYLE.Buche.fill, SPECIES_STYLE.Fichte.fill],
            "circle-opacity": POINT_FILL_OPACITY,
            "circle-stroke-color": ["case", isBuche, SPECIES_STYLE.Buche.stroke, SPECIES_STYLE.Fichte.stroke],
            "circle-stroke-width": [
              "case", ["boolean", ["feature-state", "hover"], false],
              POINT_STROKE_WEIGHT + 1.5, POINT_STROKE_WEIGHT,
            ],
            "circle-stroke-opacity": POINT_STROKE_OPACITY,
          },
        });

        FVAMap.enableHoverState(map, "standorte-punkte", "standorte");

        // -- Standorte: Hover-Tooltip (Name) -----------------------------
        map.on("mousemove", "standorte-punkte", (e) => {
          const p = e.features[0].properties;
          const name = p.label || p.popup_name || p.name || [p.standort, p.baumart].filter(Boolean).join(" ") || "Standort";
          tooltip.show(`<div class="fva-tooltip__title">${name}</div>`, e.point, { html: true });
        });
        map.on("mouseleave", "standorte-punkte", () => tooltip.hide());

        // -- Klick-Popup: Metadaten + Wasserhaushalts-Grafik -------------
        map.on("click", "standorte-punkte", (e) => {
          openStandortPopup(map, e.features[0].properties);
        });

        // -- Legende (Standardformat, immer unten rechts) ----------------
        FVAMap.addLegend(map, {
          title: LEGEND_TITLE,
          items: LEGEND_ITEMS,
        });
      });
    }

    /** Öffnet das Popup für einen Level-II-Standort (Hülle + Metadaten + Grafik). */
    function openStandortPopup(map, props) {
      const root = document.createElement("div");
      root.className = "fva-popup fva-popup--large fva-popup--level2";

      const displayName =
        props.popup_name || props.label || props.name ||
        [props.standort, props.baumart].filter(Boolean).join(" ") || "Standort";

      const header = document.createElement("div");
      header.className = "fva-popup__header";
      header.textContent = displayName;
      root.appendChild(header);

      const body = document.createElement("div");
      body.className = "fva-popup__body";
      // 90% der Kartenbreite (5% Rand links/rechts) statt fixer Breite - die
      // Grafik darf fast die ganze Kartenbreite nutzen. plotWidth wird unten
      // zusätzlich explizit als Plotly-layout.width durchgereicht, statt sich
      // auf Plotlys eigene Container-Breitenermittlung zu verlassen.
      const plotWidth = Math.round(map.getContainer().clientWidth * 0.9);
      body.style.width = plotWidth + "px";
      root.appendChild(body);
      // Obergrenze für die Grafik-Höhe (90% der Kartenhöhe) - buildTabs()
      // zieht davon noch Header/Meta/Tabs/Legende ab, damit die Grafik den
      // verbleibenden Platz ausnutzt, ohne das Modal unnötig aufzublähen.
      const plotHeight = Math.round(map.getContainer().clientHeight * 0.9);

      const meta = document.createElement("div");
      meta.className = "wh-meta";
      meta.innerHTML =
        (props.hoehe_m != null ? `<span><b>${props.hoehe_m} m</b> ü. NN</span>` : "") +
        (props.hangneigung_grad != null ? `<span>Hangneigung <b>${props.hangneigung_grad}°</b></span>` : "") +
        (props.bodentyp ? `<span><b>${props.bodentyp}</b></span>` : "");
      body.appendChild(meta);

      const chartWrap = document.createElement("div");
      chartWrap.className = "wh-loading";
      chartWrap.textContent = "Lade Wasserhaushalt …";
      body.appendChild(chartWrap);

      // Zentriertes Modal statt maplibregl.Popup + setLngLat() - bei 90%
      // Kartenbreite würde ein am Standort verankertes Popup sonst je nach
      // Klickposition/Kartenausschnitt irgendwo am Rand aufklappen statt sich
      // wie beim EPS-Modal verlässlich mittig zu zeigen. Kein manuelles
      // Repositionieren nach dem Laden/Tab-Wechsel mehr nötig - das Modal hat
      // keinen Anker, der sich verschieben könnte.
      FVAMap.openModal(map, root);

      // Fallback, falls "standort" im GeoJSON fehlt (altes Schema): aus dem
      // Namen ableiten ("Altensteig Buche" -> "Altensteig").
      const standort = props.standort || displayName.split(" ")[0];

      // Kein Flag mehr, das vorher pflegen musste, wer welche CSVs schon
      // hochgeladen hat ("wasserhaushalt_verfuegbar" in der GeoJSON) - wir
      // versuchen es einfach: CSV lädt -> Grafik, CSV fehlt (404) -> Hinweis
      // im catch() unten.
      WHChart.loadStandortData(standort, DATA_DIR)
        .then((data) => {
          const tiefen = WHChart.getTiefen(data, props.baumart);
          if (!tiefen.length) throw new Error(`keine Tiefen für Baumart "${props.baumart}" in den CSV-Daten von ${standort}`);
          buildTabs(chartWrap, data, { ...props, standort }, tiefen, plotWidth, plotHeight);
        })
        .catch((err) => {
          console.error("[karte_level2] Wasserhaushalt konnte nicht geladen werden:", err);
          chartWrap.className = "wh-hint";
          // Fehlertext bewusst sichtbar (statt generischer Meldung) - zeigt
          // sofort, ob z.B. der Standort-Name oder der Datenpfad nicht stimmt.
          chartWrap.textContent = "Wasserhaushalts-Grafik nicht verfügbar: " + err.message;
        });
    }

    /** Baut die Tiefen-Tabs + Chart-Container und zeichnet die erste Tiefe. */
    function buildTabs(container, data, props, tiefen, plotWidth, plotHeight) {
      container.className = "";
      container.innerHTML = "";

      // Tiefen-Tabs + Export-Button in einer Zeile (wie Tabs + "Export" im
      // EPS-Modal-Header).
      const tabsRow = document.createElement("div");
      tabsRow.className = "wh-tabs-row";
      container.appendChild(tabsRow);

      const tabs = document.createElement("div");
      tabs.className = "wh-tabs";
      tabsRow.appendChild(tabs);

      const exportBtn = document.createElement("button");
      exportBtn.type = "button";
      exportBtn.className = "wh-export-btn";
      exportBtn.textContent = "Export";
      exportBtn.addEventListener("click", exportChartPng);
      tabsRow.appendChild(exportBtn);

      // Grafik + Legende zusammen in einem Panel - das ist die Einheit, die
      // exportChartPng() als PNG festh\u00e4lt (nicht die Tabs/den Button).
      const panel = document.createElement("div");
      panel.className = "wh-chart-panel";
      container.appendChild(panel);

      const chartDiv = document.createElement("div");
      chartDiv.className = "wh-chart";
      panel.appendChild(chartDiv);

      const legend = document.createElement("div");
      legend.className = "wh-legend";
      legend.innerHTML = [
        ["#00BFFF", "Sehr feucht (Q90-max)"],
        ["#87CEEB", "Feucht (Q75-Q90)"],
        ["#D3D3D3", "Normal (Q25-Q75)"],
        ["#F5F5DC", "Trocken (Q25-Q10)"],
        ["#F4C2C2", "Sehr trocken (min-Q10)"],
      ].map(([c, l]) => `<span><i style="background:${c}"></i>${l}</span>`).join("") +
        [
          ["#737373", "Median (2010\u20132025)"],
          ["#D7263D", "Aktuelle nFK"],
        ].map(([c, l]) => `<span><i class="wh-legend--line" style="background:${c}"></i>${l}</span>`).join("");
      panel.appendChild(legend);

      // plotHeight (90% der Kartenh\u00f6he) gilt f\u00fcr das GANZE Popup, nicht nur
      // die Grafik - also erst Header/Meta-Zeile/Tabs/Legende abziehen. Fest
      // gesch\u00e4tzt statt live gemessen (Header ~40px + Body-Padding ~24px +
      // Meta-Zeile ~30px + Tabs ~37px + Legende ~30px), damit das Ergebnis
      // nicht von DOM-Timing beim Messen abh\u00e4ngt. 240px Mindesth\u00f6he als
      // Notbremse.
      const CHROME_ESTIMATE_PX = 170;
      const chartHeight = Math.max(240, plotHeight - CHROME_ESTIMATE_PX);

      let currentTiefe = null;

      function selectTiefe(tiefe) {
        currentTiefe = tiefe;
        [...tabs.children].forEach((btn) =>
          btn.classList.toggle("wh-tab--active", Number(btn.dataset.tiefe) === tiefe)
        );
        WHChart.renderInto(chartDiv, data, props.baumart, tiefe, { standort: props.standort, plotWidth, chartHeight });
      }

      // PNG-Export der aktuell angezeigten Tiefe (Grafik + Legende), analog
      // zu exportPng() in karte_eps.html.
      async function exportChartPng() {
        if (typeof htmlToImage === "undefined") {
          console.error("[karte_level2] html-to-image nicht geladen");
          return;
        }
        exportBtn.disabled = true;
        const originalText = exportBtn.textContent;
        exportBtn.textContent = "\u2026";
        try {
          const dataUrl = await htmlToImage.toPng(panel, {
            pixelRatio: 2,
            backgroundColor: "#ffffff",
          });
          const a = document.createElement("a");
          a.download = `Wasserhaushalt_${props.standort}_${props.baumart}_${currentTiefe}cm.png`;
          a.href = dataUrl;
          a.click();
        } catch (err) {
          console.error("[karte_level2] PNG-Export fehlgeschlagen:", err);
        } finally {
          exportBtn.disabled = false;
          exportBtn.textContent = originalText;
        }
      }

      tiefen.forEach((tiefe) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "wh-tab";
        btn.dataset.tiefe = tiefe;
        btn.textContent = tiefe + " cm";
        btn.addEventListener("click", () => selectTiefe(tiefe));
        tabs.appendChild(btn);
      });

      selectTiefe(tiefen[0]);
    }
  </script>

  <!--
    Wasserhaushalt-Grafik (Quantilband + Median + aktueller Verlauf) als
    eigenständiges Modul, gezeichnet mit Plotly.js (vendor/plotly-basic.min.js,
    s.o.) - Achsen, Crosshair und Tooltip kommen jetzt von Plotly selbst statt
    per Hand gebaut zu werden. Nur von dieser Karte genutzt.
  -->
  <script>
    const WHChart = (function () {
      "use strict";

      function parseCSV(text) {
        const lines = text.replace(/\r\n/g, "\n").trim().split("\n");
        const headers = lines[0].split(",");
        const rows = [];
        for (let i = 1; i < lines.length; i++) {
          if (!lines[i]) continue;
          const cols = lines[i].split(",");
          const row = {};
          headers.forEach((h, idx) => {
            const v = cols[idx];
            row[h] = v === "" || v === undefined ? null : v;
          });
          rows.push(row);
        }
        return rows;
      }

      function toNum(v) {
        return v === null || v === undefined || v === "" ? null : parseFloat(v);
      }

      const cache = {};

      function loadStandortData(standort, basePath) {
        if (cache[standort]) return cache[standort];
        const quartalUrl = `${basePath}${standort}_quartal.csv`;
        const aktuellUrl = `${basePath}${standort}_aktuell.csv`;
        cache[standort] = Promise.all([
          fetch(quartalUrl).then((r) => {
            if (!r.ok) throw new Error(`${quartalUrl} → HTTP ${r.status}`);
            return r.text();
          }),
          fetch(aktuellUrl).then((r) => {
            if (!r.ok) throw new Error(`${aktuellUrl} → HTTP ${r.status}`);
            return r.text();
          }),
        ]).then(([quartalTxt, aktuellTxt]) => buildStandortData(quartalTxt, aktuellTxt));
        return cache[standort];
      }

      function buildStandortData(quartalTxt, aktuellTxt) {
        const quartal = {};
        parseCSV(quartalTxt).forEach((r) => {
          const b = r.Baumart, t = r.Tiefe_cm;
          quartal[b] = quartal[b] || {};
          quartal[b][t] = quartal[b][t] || [];
          quartal[b][t].push({
            tag: toNum(r.Tag_des_Jahres),
            min: toNum(r.Min), q10: toNum(r.Q10), q25: toNum(r.Q25),
            median: toNum(r.Median), q75: toNum(r.Q75), q90: toNum(r.Q90), max: toNum(r.Max),
          });
        });
        Object.values(quartal).forEach((byTiefe) =>
          Object.values(byTiefe).forEach((rows) => rows.sort((a, b) => a.tag - b.tag))
        );

        const aktuell = {};
        parseCSV(aktuellTxt).forEach((r) => {
          const b = r.Baumart, t = r.Tiefe_cm;
          aktuell[b] = aktuell[b] || {};
          aktuell[b][t] = aktuell[b][t] || [];
          aktuell[b][t].push({ datum: r.Datum, wert: toNum(r.Aktuelle_nFK) });
        });
        Object.values(aktuell).forEach((byTiefe) =>
          Object.values(byTiefe).forEach((rows) => rows.sort((a, b) => (a.datum < b.datum ? -1 : 1)))
        );

        return { quartal, aktuell };
      }

      function getTiefen(data, baumart) {
        const t = data.quartal[baumart] ? Object.keys(data.quartal[baumart]) : [];
        return t.map(Number).sort((a, b) => a - b);
      }

      function dayOfYear(dateStr) {
        const d = new Date(dateStr + "T00:00:00");
        const start = new Date(d.getFullYear(), 0, 1);
        return Math.round((d - start) / 86400000) + 1;
      }

      const MONTH_TICKS = [
        [1, "Jan"], [32, "Feb"], [63, "Mrz"], [91, "Apr"], [122, "Mai"], [153, "Jun"],
        [183, "Jul"], [214, "Aug"], [245, "Sep"], [275, "Okt"], [306, "Nov"], [336, "Dez"],
      ];

      // Fixe hydrologische Schwellen (unabhängig von den Quantilen/vom Standort),
      // exakt wie im Original.
      const THRESHOLDS = [
        { val: 20, color: "#C8642D" },  // sehr trocken/trocken
        { val: 40, color: "#FAC83C" },  // trocken/normal
        { val: 100, color: "#82D732" }, // feucht/nass
      ];
      const ZONES = [
        { y0: 16, y1: 20, color: "#C8642D", label: "sehr trocken" },
        { y0: 36, y1: 40, color: "#FAC83C", label: "trocken" },
        { y0: 96, y1: 100, color: "#82D732", label: "feucht" },
        { y0: 100, y1: 104, color: "#1E90FF", label: "nass" },
      ];

      const MONTH_NAMES = ["Jan", "Feb", "Mrz", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
      function formatDayLabel(day) {
        const d = new Date(2026, 0, 1);
        d.setDate(d.getDate() + day - 1);
        return `${d.getDate()}. ${MONTH_NAMES[d.getMonth()]}`;
      }

      /** Baut aus Zeilen zwei parallele x/y-Arrays für eine Plotly-Linie,
       *  mit "null" an Tageslücken (>1 Tag) statt die Lücke mit einer
       *  Geraden zu überbrücken - Plotly bricht die Linie dort automatisch
       *  (connectgaps:false). */
      function withGaps(rows, dayFn, valFn) {
        const x = [], y = [];
        let prevDay = null;
        rows.forEach((r) => {
          const day = dayFn(r);
          const val = valFn(r);
          if (val === null || val === undefined) { prevDay = null; return; }
          if (prevDay !== null && day - prevDay > 1) { x.push(null); y.push(null); }
          x.push(day);
          y.push(val);
          prevDay = day;
        });
        return { x, y };
      }

      /** Zeichnet die Grafik für (baumart, tiefe) mit Plotly.js in containerEl
       *  (Plotly.newPlot räumt beim erneuten Aufruf auf demselben Div selbst
       *  auf, z.B. beim Tiefen-Tab-Wechsel). Gibt das Promise von
       *  Plotly.newPlot zurück, damit der Aufrufer nach dem tatsächlichen
       *  Zeichnen (z.B. für ein Popup-Reposition) reagieren kann. */
      function renderInto(containerEl, data, baumart, tiefe, opts) {
        const qRows = (data.quartal[baumart] && data.quartal[baumart][tiefe]) || [];
        const aRows = (data.aktuell[baumart] && data.aktuell[baumart][tiefe]) || [];
        if (!qRows.length) {
          containerEl.innerHTML = `<div class="wh-hint">Keine Daten für ${tiefe} cm.</div>`;
          return Promise.resolve();
        }

        const days   = qRows.map((r) => r.tag);
        const maxVal = Math.max(...qRows.map((r) => r.max));
        const maxY   = Math.ceil((maxVal * 1.08) / 20) * 20;

        // -- Quantilbänder: je Band zwei Scatter-Traces - untere Grenze
        //    unsichtbar, obere Grenze mit fill:'tonexty' gegen die vorherige
        //    Trace gefüllt. Reihenfolge der bandDefs = Reihenfolge der
        //    Traces = min zuerst, damit "tonexty" jeweils gegen die direkt
        //    davor liegende Grenze füllt. --------------------------------
        const bandDefs = [
          ["min", "q10", "#F4C2C2"],
          ["q10", "q25", "#F5F5DC"],
          ["q25", "q75", "#D3D3D3"],
          ["q75", "q90", "#87CEEB"],
          ["q90", "max", "#00BFFF"],
        ];
        const traces = [];
        bandDefs.forEach(([lowerKey, upperKey, color], i) => {
          if (i === 0) {
            traces.push({ x: days, y: qRows.map((r) => r[lowerKey]), mode: "lines", line: { width: 0 }, hoverinfo: "skip", showlegend: false });
          }
          traces.push({ x: days, y: qRows.map((r) => r[upperKey]), mode: "lines", line: { width: 0 }, fill: "tonexty", fillcolor: color, hoverinfo: "skip", showlegend: false });
        });

        const medianXY = withGaps(qRows, (r) => r.tag, (r) => r.median);
        traces.push({ x: medianXY.x, y: medianXY.y, mode: "lines", line: { color: "#737373", width: 2 }, connectgaps: false, hoverinfo: "skip", showlegend: false });

        let heuteTag = null;
        if (aRows.length) {
          const aktuellXY = withGaps(aRows, (r) => dayOfYear(r.datum), (r) => r.wert);
          traces.push({ x: aktuellXY.x, y: aktuellXY.y, mode: "lines", line: { color: "#D7263D", width: 2 }, connectgaps: false, hoverinfo: "skip", showlegend: false });
          heuteTag = dayOfYear(aRows[aRows.length - 1].datum);
        }

        // -- Eine unsichtbare Hover-Trace für den ganzen Zeitraum statt Hover
        //    auf den (teils unsichtbaren) Band-/Linien-Traces einzeln
        //    zuzulassen - ein Tooltip pro Tag mit Datum + Median + Aktuell,
        //    wie im Original. hovermode:'x' unten findet den nächsten Tag
        //    unabhängig vom y-Abstand zum Cursor. -------------------------
        const qByDay = new Map(qRows.map((r) => [r.tag, r.median]));
        const aByDay = new Map(aRows.filter((r) => r.wert !== null).map((r) => [dayOfYear(r.datum), r.wert]));
        const hoverText = days.map((day) => {
          const med = qByDay.get(day);
          const akt = aByDay.get(day);
          return `<b>${formatDayLabel(day)}</b><br>` +
            (med != null ? `<span style="color:#737373">▬</span> Median: ${med}<br>` : "") +
            (akt != null ? `<span style="color:#D7263D">▬</span> Aktuell: ${akt}` : "");
        });
        traces.push({
          x: days, y: days.map(() => maxY), mode: "markers",
          marker: { opacity: 0, size: 24 }, hoverinfo: "text", hovertext: hoverText,
          showlegend: false,
        });

        // -- Schwellenlinien (fix, farbig) -------------------------------
        const shapes = THRESHOLDS.filter((t) => t.val <= maxY).map((t) => ({
          type: "line", xref: "x", x0: days[0], x1: days[days.length - 1],
          yref: "y", y0: t.val, y1: t.val, line: { color: t.color, width: 1.5 },
        }));

        // -- Zonen-Beschriftungen rechts: farbiges Kästchen MIT schwarzer
        //    Beschriftung drin (nicht Kästchen + Text daneben) -------------
        // Kästchen als echtes Rechteck (shape), Text als eigene Annotation
        // exakt darüber zentriert. "paper" x=0..1 deckt hier genau die
        // Plot-Fläche ab (Marge liegt außerhalb), daher die Umrechnung von
        // Pixel-Offsets über plotAreaWidthPx/-HeightPx.
        const plotAreaWidthPx  = opts.plotWidth - 50 - 90; // layout.width - margin.l - margin.r
        const plotAreaHeightPx = opts.chartHeight - 10 - 40; // layout.height - margin.t - margin.b
        const pxToDataY  = maxY / plotAreaHeightPx;
        const pxToPaperX = 1 / plotAreaWidthPx;

        const BADGE_W = 74; // px, breit genug für "sehr trocken" bei font-size 9
        const BADGE_H = 13; // px

        const annotations = [];
        ZONES.filter((z) => z.y1 <= maxY * 1.2).forEach((z) => {
          const cy = (z.y0 + z.y1) / 2;
          const halfH = (BADGE_H / 2) * pxToDataY;
          shapes.push({
            type: "rect", xref: "paper", yref: "y",
            x0: 1 + 6 * pxToPaperX, x1: 1 + (6 + BADGE_W) * pxToPaperX,
            y0: cy - halfH, y1: cy + halfH,
            fillcolor: z.color, line: { width: 0 },
          });
          annotations.push({
            xref: "paper", x: 1 + (6 + BADGE_W / 2) * pxToPaperX, xanchor: "center",
            yref: "y", y: cy, yanchor: "middle",
            text: z.label, showarrow: false, font: { size: 9, color: "#000" }, align: "center",
          });
        });

        // -- "Letztes Update"-Marker: volle Höhe gepunktet + lila Box mit
        //    Datum des letzten Messwerts (heuteTag ist trotz des Namens nicht
        //    zwangsläufig der heutige Tag, sondern der jüngste Eintrag in der
        //    Aktuell-CSV) -----------------------------------------------
        if (heuteTag !== null) {
          const label = aRows[aRows.length - 1].datum.split("-").reverse().join(".");
          const text  = `Letztes Update: ${label}`;

          // Box-Größe aus der tatsächlichen Textlänge ableiten (in Pixel,
          // dann wie oben in Daten-/Tageseinheiten umgerechnet), statt eines
          // festen 70-100-Bereichs - sonst passt der rotierte Text bei
          // "Letztes Update: DD.MM.YYYY" nicht immer vollständig in die Box.
          // ~5px/Zeichen bei font-size 9 (grobe, aber ausreichend
          // großzügige Schätzung) + etwas Luft.
          const pxToDataX = (days[days.length - 1] - days[0]) / plotAreaWidthPx;
          const boxLenData   = (text.length * 5 + 12) * pxToDataY;  // Länge = Textrichtung (rotiert)
          const boxThickData = 14 * pxToDataX;                       // Dicke = Zeilenhöhe der Schrift
          const boxTop    = 100; // wie im Original: oben exakt an der feucht/nass-Trennlinie
          const boxBottom = Math.max(0, boxTop - boxLenData);
          const boxX0     = Math.max(days[0], heuteTag - boxThickData);

          shapes.push(
            { type: "line", xref: "x", x0: heuteTag, x1: heuteTag, yref: "paper", y0: 0, y1: 1, line: { color: "#000", width: 1, dash: "dot" } },
            { type: "rect", xref: "x", x0: boxX0, x1: heuteTag, yref: "y", y0: boxBottom, y1: boxTop, fillcolor: "#9370DB", opacity: 0.9, line: { width: 0 } }
          );
          annotations.push({
            // xanchor/yanchor:center statt right/middle - bei rotiertem Text
            // (textangle) dreht Plotly um die Textmitte, ein Rand-Anker hätte
            // das Label aus der lila Box heraus verschoben.
            xref: "x", x: (boxX0 + heuteTag) / 2, xanchor: "center",
            yref: "y", y: (boxBottom + boxTop) / 2, yanchor: "middle",
            text, textangle: -90,
            showarrow: false, font: { size: 9, color: "#fff" },
          });
        }

        const layout = {
          margin: { l: 50, r: 90, t: 10, b: 40 },
          // Explizit statt Plotlys eigener Größenermittlung überlassen (die
          // sich auf die Container-Größe zur Renderzeit verlässt) - beide
          // kommen aus buildTabs()/openStandortPopup() (90% der Karten-
          // breite/-höhe, Höhe abzüglich Header/Tabs/Legende).
          width: opts.plotWidth,
          height: opts.chartHeight,
          xaxis: {
            range: [days[0], days[days.length - 1]],
            tickmode: "array",
            tickvals: MONTH_TICKS.map((t) => t[0]),
            ticktext: MONTH_TICKS.map((t) => t[1]),
            tickfont: { size: 9, color: "#666" },
            title: { text: "Tag des Jahres", font: { size: 10, color: "#444" } },
            showgrid: false,
            showspikes: true, spikemode: "across", spikethickness: 1, spikedash: "dot", spikecolor: "#999", spikesnap: "cursor",
          },
          yaxis: {
            range: [0, maxY], dtick: 20, gridcolor: "#e5e5e5", zeroline: false,
            tickfont: { size: 9, color: "#666" },
            title: { text: "Pflanzenverfügbares Wasser (%nFK)", font: { size: 10, color: "#444" } },
          },
          shapes: shapes,
          annotations: annotations,
          showlegend: false,
          hovermode: "x",
          hoverlabel: { bgcolor: "#fff", bordercolor: "#ccc", font: { size: 12, color: "#222" } },
          plot_bgcolor: "#fff", paper_bgcolor: "#fff",
        };

        const config = { displayModeBar: false, responsive: true, staticPlot: false };

        // Wie beim alten Hand-SVG: Container als Bild beschriften, statt
        // Screenreadern Plotlys interne SVG-Struktur roh vorzusetzen.
        containerEl.setAttribute("role", "img");
        containerEl.setAttribute("aria-label", `${opts.standort} ${baumart.replace(/_/g, " ")} – ${tiefe} cm (%nFK)`);

        return Plotly.newPlot(containerEl, traces, layout, config);
      }

      return { loadStandortData, buildStandortData, getTiefen, renderInto };
    })();
  </script>
</body>
</html>
